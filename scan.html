<!DOCTYPE html>
<html dir="rtl">
<body style="font-family:sans-serif;padding:20px;background:#111;color:#0f0;">
  <h2>استخراج مسار التأويل وقاعدة البيانات (آمن للنسخ المباشر)</h2>
  <input type="file" id="f" style="font-size:20px;margin:20px 0;">
  <button onclick="copyOut()" style="font-size:18px;padding:10px 20px;">📋 نسخ النتيجة</button>
  <pre id="out" style="background:#222;padding:15px;white-space:pre-wrap;color:#fff;"></pre>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    document.getElementById('f').onchange = async (e) => {
      const file = e.target.files[0];
      const out = document.getElementById('out');
      out.textContent = "⏳ جاري البحث عن قاعدة بيانات التأويل ومسارات الـ API...";
      
      const zip = await JSZip.loadAsync(file);
      let nonPageAssets = [], sqlAndTafsir = new Set(), apiPaths = new Set();

      for (const [name, entry] of Object.entries(zip.files)) {
        if (name.endsWith('.apk')) {
          const innerZip = await JSZip.loadAsync(await entry.async("uint8array"));
          for (const [iname, ientry] of Object.entries(innerZip.files)) {
            if (iname.includes('assets/') && !iname.includes('pages-qcf') && !iname.includes('/fonts/') && !iname.endsWith('.png')) {
              const data = await ientry.async("uint8array");
              nonPageAssets.push(iname.replace('assets/flutter_assets/', '') + " (" + data.length + " bytes)");
            }
            if (iname.endsWith('libapp.so')) {
              const bytes = await ientry.async("uint8array");
              const text = new TextDecoder("ascii").decode(bytes);

              // 1. جميع أوامر SQL أو الجداول المرتبطة بـ alamin748965 و tafsir
              const m1 = text.match(/[\x20-\x7e]{0,60}(?:SELECT |FROM |TABLE |alamin748965|tafsir|taweel|ayah_text|sura_no|aya_no|books|categories|audiobook)[\x20-\x7e]{0,60}/gi) || [];
              m1.forEach(s => {
                if (!/flutter|package:|Widget|Material|Cupertino|State|BuildContext|Audio/i.test(s)) {
                  sqlAndTafsir.add(s.trim());
                }
              });

              // 2. مسارات الـ API التي تبدأ بـ /api أو تحتوي على علامة /
              const m2 = text.match(/\/(?:api\/v1|books|categories|tafsir|audio|public|storage|uploads)[a-zA-Z0-9_\/.?=&%-]{1,80}/gi) || [];
              m2.forEach(s => apiPaths.add(s.trim()));
            }
          }
        }
      }

      out.textContent = "نتائج فحص بيانات التطبيق:\n\n" +
        "1) ملفات الـ Assets غير الصفحات والخطوط:\n" + nonPageAssets.join("\n") +
        "\n\n2) مسارات السيرفر الفرعية:\n" + [...apiPaths].join("\n") +
        "\n\n3) استعلامات التأويل وقاعدة البيانات:\n" + [...sqlAndTafsir].slice(0, 180).join("\n");
    };

    function copyOut() {
      navigator.clipboard.writeText(document.getElementById('out').textContent);
      alert("تم النسخ! يمكنك لصقه في الدردشة بأمان تام.");
    }
  </script>
</body>
</html>
