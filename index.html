<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>روح القرآن ونعيمه</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f9f4; --card: #ffffff; --text: #1e2d24; --muted: #5c7065;
      --primary: #2e7d32; --primary-light: #e0f2e1; --border: #dce8dd; --font-scale: 1;
      --tawil-scale: 1;
    }
    body.theme-sepia {
      --bg: #f6efe2; --card: #fdf8ee; --text: #3b2820; --muted: #7a6356;
      --primary: #6d4c41; --primary-light: #eadbc6; --border: #e2d2bc;
    }
    body.theme-dark {
      --bg: #111814; --card: #1b2620; --text: #e8f0ec; --muted: #96aba0;
      --primary: #4caf50; --primary-light: #24382b; --border: #2a3b31;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 76px; transition: 0.2s; }
    .top-bar {
      position: sticky; top: 0; z-index: 100; background: var(--card); border-bottom: 1px solid var(--border);
      padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); }
    .brand h1 { font-size: 1.05rem; font-weight: 700; color: var(--primary); }
    .top-tools { display: flex; align-items: center; gap: 6px; }
    .tool-btn {
      background: var(--primary-light); color: var(--primary); border: none; border-radius: 8px;
      padding: 6px 10px; font-family: inherit; font-weight: 700; font-size: 0.85rem; cursor: pointer;
    }
    .sub-tabs {
      display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px;
      background: var(--card); border-bottom: 1px solid var(--border); scrollbar-width: none;
    }
    .sub-tabs::-webkit-scrollbar { display: none; }
    .chip {
      white-space: nowrap; padding: 7px 14px; border-radius: 20px; font-size: 0.88rem;
      font-weight: 600; cursor: pointer; background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .container { padding: 12px 14px; max-width: 900px; margin: 0 auto; }
    /* بطاقة الاقتباس اليومي */
    .daily-quote {
      background: linear-gradient(135deg, var(--primary-light), var(--card));
      border: 1px solid var(--border); border-right: 4px solid var(--primary);
      border-radius: 14px; padding: 12px 14px; margin-bottom: 12px;
    }
    .daily-quote-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
    .daily-quote-text { font-family: 'Amiri', serif; font-size: 1.05rem; line-height: 1.7; }
    .search-box {
      width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-family: inherit; font-size: 0.95rem; margin-bottom: 12px;
    }
    .item-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px;
      margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    }
    .badge-num {
      width: 38px; height: 38px; border-radius: 50%; background: var(--primary-light); color: var(--primary);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; flex-shrink: 0;
    }
    .card-info { flex: 1; margin: 0 12px; }
    .card-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
    .card-sub { font-size: 0.82rem; color: var(--muted); line-height: 1.4; }
    .quran-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 16px;
      font-family: 'Amiri Quran', 'Amiri', serif; font-size: calc(1.55rem * var(--font-scale)); line-height: 2.35; text-align: justify;
    }
    .bismillah { text-align: center; color: var(--primary); margin-bottom: 14px; font-size: calc(1.4rem * var(--font-scale)); }
    .ayah-span { padding: 2px 4px; border-radius: 6px; cursor: pointer; }
    .ayah-span.selected { background: rgba(46, 125, 50, 0.22); border-bottom: 2px solid var(--primary); }
    .ayah-span.hl-yellow { background: rgba(255, 213, 79, 0.45); }
    .ayah-span.hl-blue { background: rgba(79, 195, 247, 0.38); }
    .ayah-span.hl-red { background: rgba(239, 154, 154, 0.42); }
    .ayah-num {
      display: inline-flex; align-items: center; justify-content: center; font-size: 0.72em;
      color: var(--primary); margin: 0 4px; border: 1px solid var(--primary); border-radius: 50%; width: 1.65em; height: 1.65em;
    }
    /* شريط إجراءات الآية المحددة */
    .ayah-sheet {
      position: fixed; bottom: 68px; left: 12px; right: 12px; z-index: 200; background: var(--card);
      border: 1px solid var(--border); border-radius: 16px; padding: 14px; box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      display: none; max-width: 600px; margin: 0 auto;
    }
    .ayah-sheet.show { display: block; }
    .sheet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .range-hint { font-size: 0.76rem; color: var(--primary); margin-bottom: 10px; font-weight: 600; }
    .color-dots { display: flex; gap: 8px; }
    .color-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #ccc; cursor: pointer; }
    .sheet-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
    .act-btn {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 4px; font-family: inherit; font-size: 0.82rem; font-weight: 600; color: var(--text); cursor: pointer;
    }
    /* نافذة التأويل المطابقة لتطبيق مكتبة الأمين 100% */
    .tawil-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 300;
      display: none; align-items: flex-end; justify-content: center;
    }
    .tawil-modal-backdrop.show { display: flex; }
    .tawil-modal {
      background: var(--card); width: 100%; max-width: 750px; height: 84vh;
      border-radius: 22px 22px 0 0; display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 -6px 25px rgba(0,0,0,0.25);
    }
    .tawil-drag-handle { width: 42px; height: 5px; background: #ccc; border-radius: 4px; margin: 10px auto 4px; }
    .tawil-header {
      padding: 10px 18px 12px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .tawil-header-right { font-family: 'Amiri', serif; font-size: 1.15rem; font-weight: 700; color: var(--primary); }
    .tawil-header-left { font-size: 1.05rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 12px; }
    .tawil-body {
      flex: 1; overflow-y: auto; padding: 20px 18px;
      font-family: 'Amiri', serif; font-size: calc(1.3rem * var(--tawil-scale)); line-height: 2.15;
    }
    .tawil-ayah-framed {
      text-align: center; font-family: 'Amiri Quran', 'Amiri', serif;
      font-size: calc(1.4rem * var(--tawil-scale)); color: var(--text);
      margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px dashed var(--border);
    }
    .tawil-footer {
      border-top: 1px solid var(--border); padding: 12px 20px; background: var(--card);
      display: flex; justify-content: space-between; align-items: center;
    }
    .tawil-nav-btn {
      background: none; border: none; color: var(--primary); font-family: inherit;
      font-size: 0.95rem; font-weight: 700; cursor: pointer; padding: 6px 10px;
    }
    .tawil-font-controls { display: flex; align-items: center; gap: 16px; }
    .tawil-font-btn {
      background: none; border: none; color: var(--primary); font-weight: 700;
      font-size: 1.15rem; cursor: pointer;
    }
    .book-reader {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px;
      font-family: 'Amiri', serif; font-size: calc(1.25rem * var(--font-scale)); line-height: 2.0; white-space: pre-wrap;
    }
    .search-hit-mark { background: rgba(255, 213, 79, 0.65); padding: 0 3px; border-radius: 4px; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 150; background: var(--card);
      border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); height: 62px;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; font-size: 0.76rem; font-weight: 600; color: var(--muted); cursor: pointer; border: none; background: none; font-family: inherit;
    }
    .nav-item.active { color: var(--primary); }
    .nav-icon { font-size: 1.25rem; }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <img src="assets/logo.jpg" onerror="this.src='assets/logo.png'" alt="شعار">
      <h1>روح القرآن ونعيمه</h1>
    </div>
    <div class="top-tools">
      <button class="tool-btn" type="button" onclick="changeFont(0.1)">A+</button>
      <button class="tool-btn" type="button" onclick="changeFont(-0.1)">A-</button>
      <button class="tool-btn" type="button" onclick="cycleTheme()">🎨 الثيم</button>
    </div>
  </header>

  <main id="mainView">
    <div class="container"><p style="text-align:center;padding:40px;">⏳ جاري تحميل المصحف الشريف والمكتبة...</p></div>
  </main>

  <!-- شريط خيارات الآية المحددة (متتابعة حصراً) -->
  <div class="ayah-sheet" id="ayahSheet">
    <div class="sheet-top">
      <strong id="selectedAyahLabel">سورة ...</strong>
      <div class="color-dots">
        <div class="color-dot" style="background:#ffd54f" onclick="highlightSelected('hl-yellow')"></div>
        <div class="color-dot" style="background:#4fc3f7" onclick="highlightSelected('hl-blue')"></div>
        <div class="color-dot" style="background:#ef9a9a" onclick="highlightSelected('hl-red')"></div>
        <div class="color-dot" style="background:#fff" onclick="highlightSelected('')"></div>
      </div>
      <button class="tool-btn" type="button" onclick="clearSelection()">✕</button>
    </div>
    <div class="range-hint">🔒 تحديد الآيات متتابع تلقائياً للحفاظ على سياق القرآن الكريم</div>
    <div class="sheet-actions">
      <button class="act-btn" type="button" onclick="openTawilModalForSelected()">📖 التأويل</button>
      <button class="act-btn" type="button" onclick="playSelectedAyah()">▶️ استماع</button>
      <button class="act-btn" type="button" onclick="saveAyahAsImage()">🖼️ كصورة</button>
      <button class="act-btn" type="button" onclick="shareSelectedAyah()">📤 مشاركة</button>
    </div>
    <audio id="ayahAudio" style="width:100%; margin-top:10px; display:none;" controls></audio>
  </div>

  <!-- نافذة التأويل المطابقة لتطبيق مكتبة الأمين (آية بآية مع أزرار السابقة والتالي) -->
  <div class="tawil-modal-backdrop" id="tawilBackdrop" onclick="if(event.target===this)closeTawilModal()">
    <div class="tawil-modal">
      <div class="tawil-drag-handle"></div>
      <div class="tawil-header">
        <div class="tawil-header-right" id="tawilHeaderRight">سورة ... آية ...</div>
        <div class="tawil-header-left">
          <span>التأويل</span>
          <button class="tool-btn" type="button" onclick="closeTawilModal()">✕</button>
        </div>
      </div>
      <div class="tawil-body" id="tawilBody"></div>
      <div class="tawil-footer">
        <button class="tawil-nav-btn" type="button" onclick="stepTawilAyah(-1)">❮ السابقة</button>
        <div class="tawil-font-controls">
          <button class="tawil-font-btn" type="button" onclick="changeTawilFont(-0.1)">A-</button>
          <button class="tawil-font-btn" type="button" onclick="changeTawilFont(0.1)">A+</button>
        </div>
        <button class="tawil-nav-btn" type="button" onclick="stepTawilAyah(1)">التالي ❯</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" type="button" onclick="switchTab('quran', this)"><span class="nav-icon">📖</span><span>تصفح المصحف</span></button>
    <button class="nav-item" type="button" onclick="switchTab('books', this)"><span class="nav-icon">📚</span><span>الكتب</span></button>
    <button class="nav-item" type="button" onclick="switchTab('audio', this)"><span class="nav-icon">🎧</span><span>الصوتيات</span></button>
    <button class="nav-item" type="button" onclick="switchTab('search', this)"><span class="nav-icon">🔍</span><span>البحث الذكي</span></button>
    <button class="nav-item" type="button" onclick="switchTab('bookmarks', this)"><span class="nav-icon">🔖</span><span>علاماتي</span></button>
  </nav>

  <script>
    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg) { tg.expand(); tg.ready(); }

    let quranData = [];
    let booksData = [];
    let ayahTawilDB = {
      "67:3": "3- {الَّذِي خَلَقَ سَبْعَ سَمَاوَاتٍ طِبَاقًا}: متطابقة بالخير وهي فوق بعضها. فسماء الشمس فوق سماء القمر وسماء القمر فوق سماء الغيوم.... والكل يعمل ويدور من أجلك أيها الإنسان. {مَّا تَرَىٰ فِي خَلْقِ الرَّحْمَٰنِ مِن تَفَاوُتٍ}: ليس من اختلاف، كل الكون وكل ما فيه مترابط متآزر متكاتف يعمل مع غيره، ففكر أيها الإنسان يد من التي خلقتهم وتمدهم وتسيرهم؟ أفلا تلتفت لهذا الرب المسيّر وكله من أجلك ومن أجل طعامك وشرابك وراحتك وسعادتك؟! {فَارْجِعِ الْبَصَرَ}: انظر وفكّر بالكون مدقّقاً. {هَلْ تَرَىٰ مِن فُطُورٍ}: هل ترى من نقص أو خلل؟ هل ترى تنافراً وانفصالاً؟ فكل شيء يرتبط مع غيره وفق ترتيب محكم، فالثمرة تنشأ من البذرة، وهذه بحاجة للهواء..."
    };
    let currentSurah = null;
    let rangeStartAyah = null;
    let rangeEndAyah = null;
    let activeTawilSurah = 1;
    let activeTawilAyah = 1;

    let savedHighlights = JSON.parse(localStorage.getItem('roh_highlights') || '{}');
    let fontScale = parseFloat(localStorage.getItem('roh_font') || '1');
    let tawilScale = parseFloat(localStorage.getItem('roh_tawil_font') || '1');
    let themeIdx = parseInt(localStorage.getItem('roh_theme') || '0');
    const themes = ['', 'theme-sepia', 'theme-dark'];

    document.documentElement.style.setProperty('--font-scale', fontScale);
    document.documentElement.style.setProperty('--tawil-scale', tawilScale);
    if (themes[themeIdx]) document.body.className = themes[themeIdx];

    /* فهرس مجلدات تأويل القرآن العظيم التسعة */
    function getTawilVolumeInfo(surahNum) {
      if (surahNum <= 4) return "تأويل القرآن العظيم - المجلد الأول (الفاتحة، البقرة، آل عمران، النساء)";
      if (surahNum <= 9) return "تأويل القرآن العظيم - المجلد الثاني (من سورة المائدة إلى سورة التوبة)";
      if (surahNum <= 17) return "تأويل القرآن العظيم - المجلد الثالث (من سورة يونس إلى سورة الإسراء)";
      if (surahNum <= 25) return "تأويل القرآن العظيم - المجلد الرابع (من سورة الكهف إلى سورة الفرقان)";
      if (surahNum <= 39) return "تأويل القرآن العظيم - المجلد الخامس (من سورة الشعراء إلى سورة الزمر)";
      if (surahNum <= 57) return "تأويل القرآن العظيم - المجلد السادس (من سورة غافر إلى سورة الحديد)";
      if (surahNum <= 66) return "تأويل القرآن العظيم - المجلد السابع (جزء قد سمع)";
      if (surahNum <= 77) return "تأويل القرآن العظيم - المجلد الثامن (جزء تبارك)";
      return "تأويل القرآن العظيم - المجلد التاسع (جزء عمّ)";
    }

    function cleanShortcodes(txt) {
      if (!txt) return '';
      return txt
        .replace(/\[\/?box[^\]]*\]/gi, '')
        .replace(/align="[^"]*"/gi, '')
        .replace(/class="[^"]*"/gi, '')
        .replace(/widt[h]?="[^"]*"/gi, '')
        .trim();
    }

    function changeFont(delta) {
      fontScale = Math.min(1.6, Math.max(0.8, +(fontScale + delta).toFixed(2)));
      document.documentElement.style.setProperty('--font-scale', fontScale);
      localStorage.setItem('roh_font', fontScale);
    }

    function changeTawilFont(delta) {
      tawilScale = Math.min(1.6, Math.max(0.8, +(tawilScale + delta).toFixed(2)));
      document.documentElement.style.setProperty('--tawil-scale', tawilScale);
      localStorage.setItem('roh_tawil_font', tawilScale);
    }

    function cycleTheme() {
      themeIdx = (themeIdx + 1) % themes.length;
      document.body.className = themes[themeIdx];
      localStorage.setItem('roh_theme', themeIdx);
    }

    function normalizeAr(str) {
      if (!str) return '';
      return str.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
    }

    async function loadAllData() {
      try {
        try {
          const qRes = await fetch('data/quran.json');
          if (qRes.ok) quranData = await qRes.json();
        } catch (e) {}
        if (!quranData || quranData.length === 0) {
          const apiRes = await fetch('https://api.alquran.cloud/v1/quran/quran-uthmani');
          const apiJson = await apiRes.json();
          quranData = apiJson.data.surahs;
        }
        try {
          const bRes = await fetch('data/app_books.json');
          if (bRes.ok) {
            const rawB = await bRes.json();
            booksData = rawB.map(b => ({
              ...b,
              summary: cleanShortcodes(b.summary),
              content: cleanShortcodes(b.content)
            }));
          }
        } catch (e) {}
        try {
          const tRes = await fetch('data/tawil_ayahs.json');
          if (tRes.ok) {
            const extraTawil = await tRes.json();
            Object.assign(ayahTawilDB, extraTawil);
          }
        } catch (e) {}
        renderQuranList('surahs');
      } catch (err) {
        document.getElementById('mainView').innerHTML = '<div class="container"><p style="text-align:center;padding:30px;">تحقق من الاتصال بالإنترنت.</p></div>';
      }
    }

    function getDailyQuoteHtml() {
      if (!booksData || booksData.length === 0) return '';
      const dayIndex = Math.floor(Date.now() / 86400000) % booksData.length;
      const item = booksData[dayIndex];
      const quoteTxt = (item.content || item.summary || '').substring(0, 220).trim();
      if (!quoteTxt) return '';
      return `
        <div class="daily-quote">
          <div class="daily-quote-header">
            <span>✨ إشراقة اليوم من المكتبة</span>
            <span style="cursor:pointer;" onclick="openBookItem(${item.id})">اقرأ المصدر ❯</span>
          </div>
          <div class="daily-quote-text">«${quoteTxt}...»</div>
          <div style="font-size:0.78rem;color:var(--muted);margin-top:4px;">— ${item.title}</div>
        </div>`;
    }

    function switchTab(tab, btn) {
      clearSelection();
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      if (tab === 'quran') renderQuranList('surahs');
      else if (tab === 'books') renderBooksTab('الكل');
      else if (tab === 'audio') renderAudioTab('tawil');
      else if (tab === 'search') renderSearchTab();
      else if (tab === 'bookmarks') renderBookmarksTab();
    }

    function renderQuranList(mode) {
      const view = document.getElementById('mainView');
      let html = `
        <div class="sub-tabs">
          <div class="chip ${mode==='surahs'?'active':''}" onclick="renderQuranList('surahs')">السور (114)</div>
          <div class="chip ${mode==='juz'?'active':''}" onclick="renderQuranList('juz')">الأجزاء (30)</div>
          <div class="chip ${mode==='pages'?'active':''}" onclick="renderQuranList('pages')">الصفحات (604)</div>
        </div>
        <div class="container">
          ${getDailyQuoteHtml()}
          <input type="text" class="search-box" placeholder="ابحث عن اسم السورة..." oninput="filterSurahs(this.value)">
          <div>`;
      if (mode === 'surahs') {
        quranData.forEach(s => {
          const rev = s.revelationType === 'Meccan' ? 'مكية' : 'مدنية';
          const page = (s.ayahs && s.ayahs[0]) ? s.ayahs[0].page : 1;
          html += `<div class="item-card surah-item" data-name="${normalizeAr(s.name)}" onclick="openSurah(${s.number})">
            <div class="badge-num">${s.number}</div>
            <div class="card-info"><div class="card-title">${s.name}</div><div class="card-sub">${rev} • ${s.ayahs.length} آيات • صفحة ${page}</div></div>

        el.style.display = el.dataset.name.includes(nq) ? 'flex' : 'none';

    function openSurah(num, scrollToAyah) {
      const s = quranData.find(x => x.number === num);
      if (!s) return;
      currentSurah = s;
      clearSelection();
      const juz = s.ayahs[0] ? s.ayahs[0].juz : 1;
      let ayahsHtml = '';
      s.ayahs.forEach(a => {
        const key = `${s.number}:${a.numberInSurah}`;
        const hl = savedHighlights[key] || '';
        let txt = a.text;
        if (s.number !== 1 && a.numberInSurah === 1) txt = txt.replace('بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ', '').trim();
        ayahsHtml += `<span class="ayah-span ${hl}" id="ay-${a.numberInSurah}" onclick="selectConsecutiveAyah(${a.numberInSurah})">${txt} <span class="ayah-num">${a.numberInSurah}</span> </span>`;
      });
      document.getElementById('mainView').innerHTML = `
        <div class="sub-tabs" style="justify-content:space-between;align-items:center;">

          <div class="quran-box">${s.number !== 9 ? '<div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>' : ''}${ayahsHtml}</div>

      window.scrollTo(0, 0);

    function openJuz(juzNum) {
      const s = quranData.find(surah => surah.ayahs.some(a => a.juz === juzNum));
      if (s) openSurah(s.number);
    }

    function openPage(pageNum) {
      const s = quranData.find(surah => surah.ayahs.some(a => a.page >= pageNum));
      if (s) openSurah(s.number);
    }

    /* قفل التتابع الإجباري للآيات (يمنع تحديد آيات متفرقة نهائياً) */
    function selectConsecutiveAyah(aNum) {
      if (rangeStartAyah === null) {
        rangeStartAyah = aNum;
        rangeEndAyah = aNum;
      } else if (rangeStartAyah === aNum && rangeEndAyah === aNum) {
        clearSelection();
        return;
      } else if (aNum >= rangeStartAyah && aNum <= rangeEndAyah) {
        rangeStartAyah = aNum;
        rangeEndAyah = aNum;
      } else if (Math.abs(aNum - rangeEndAyah) <= 10 && Math.abs(aNum - rangeStartAyah) <= 10) {
        rangeStartAyah = Math.min(rangeStartAyah, aNum);
        rangeEndAyah = Math.max(rangeEndAyah, aNum);
      } else {
        rangeStartAyah = aNum;
        rangeEndAyah = aNum;
      }
      updateRangeHighlightUI();
    }

    function updateRangeHighlightUI() {
      document.querySelectorAll('.ayah-span').forEach(el => el.classList.remove('selected'));
      const sheet = document.getElementById('ayahSheet');
      if (rangeStartAyah === null || !currentSurah) {
        if (sheet) sheet.classList.remove('show');
        return;
      }
      for (let i = rangeStartAyah; i <= rangeEndAyah; i++) {
        const el = document.getElementById('ay-' + i);
        if (el) el.classList.add('selected');
      }
      sheet.classList.add('show');
      const label = rangeStartAyah === rangeEndAyah
        ? `${currentSurah.name} - آية (${rangeStartAyah})`
        : `${currentSurah.name} - الآيات المتتالية (${rangeStartAyah} إلى ${rangeEndAyah})`;
      document.getElementById('selectedAyahLabel').textContent = label;
    }

    function clearSelection() {
      rangeStartAyah = null;
      rangeEndAyah = null;
      document.querySelectorAll('.ayah-span').forEach(el => el.classList.remove('selected'));
      const sheet = document.getElementById('ayahSheet');
      if (sheet) sheet.classList.remove('show');
    }

    function highlightSelected(colorClass) {
      if (rangeStartAyah === null || !currentSurah) return;
      for (let i = rangeStartAyah; i <= rangeEndAyah; i++) {
        const key = `${currentSurah.number}:${i}`;
        const el = document.getElementById('ay-' + i);
        if (el) {
          el.classList.remove('hl-yellow', 'hl-blue', 'hl-red');
          if (colorClass) el.classList.add(colorClass);
        }
        if (colorClass) savedHighlights[key] = colorClass;
        else delete savedHighlights[key];
      }
      localStorage.setItem('roh_highlights', JSON.stringify(savedHighlights));
      clearSelection();
    }

    function getSelectedAyahsText() {
      if (!currentSurah || rangeStartAyah === null) return '';
      const parts = [];
      for (let i = rangeStartAyah; i <= rangeEndAyah; i++) {
        const ay = currentSurah.ayahs.find(x => x.numberInSurah === i);
        if (ay) parts.push(`${ay.text} (${i})`);
      }
      const rangeStr = rangeStartAyah === rangeEndAyah ? `${rangeStartAyah}` : `${rangeStartAyah}-${rangeEndAyah}`;
      return `{${parts.join(' ')}}[${currentSurah.name}:${rangeStr}]`;
    }

    function playSelectedAyah() {
      if (rangeStartAyah === null || !currentSurah) return;
      const audio = document.getElementById('ayahAudio');
      audio.src = `https://everyayah.com/data/Alafasy_128kbps/${String(currentSurah.number).padStart(3,'0')}${String(rangeStartAyah).padStart(3,'0')}.mp3`;
      audio.style.display = 'block';
      audio.play();
    }

    /* نافذة التأويل المطابقة لتطبيق مكتبة الأمين (سورة كذا آية كذا + أزرار السابقة والتالي) */
    function openTawilModalForSelected() {
      if (!currentSurah) return;
      const startA = rangeStartAyah || 1;
      clearSelection();
      openTawilModal(currentSurah.number, startA);

    function openTawilModal(sNum, aNum) {
      activeTawilSurah = sNum;

    function closeTawilModal() {
      document.getElementById('tawilBackdrop').classList.remove('show');

    function stepTawilAyah(delta) {
      const s = quranData.find(x => x.number === activeTawilSurah);
      if (!s) return;
      const nextA = activeTawilAyah + delta;
      if (nextA >= 1 && nextA <= s.ayahs.length) {
        activeTawilAyah = nextA;
        renderTawilModalContent();
      }
    }

    function renderTawilModalContent() {
      const s = quranData.find(x => x.number === activeTawilSurah);
      if (!s) return;
      const ay = s.ayahs.find(x => x.numberInSurah === activeTawilAyah) || s.ayahs[0];
      const shortSName = s.name.replace('سُورَةُ', '').trim();
      document.getElementById('tawilHeaderRight').textContent = `${s.name} آية ${ay.numberInSurah}`;

      const key = `${s.number}:${ay.numberInSurah}`;
      const volTitle = getTawilVolumeInfo(s.number);
      let tawilText = ayahTawilDB[key];

      if (!tawilText) {
        tawilText = `📚 هذه الآية الكريمة ضمن (${volTitle}).\n\n` +
          `لإظهار النص التفصيلي الكامل لتأويل الآية (${ay.numberInSurah}) من ${s.name} كما في تطبيق مكتبة الأمين، يرجى إرسال ملف قاعدة بيانات التطبيق (أو ملف الـ ePUB الخاص بالمجلد) إلى البوت ليتم تفريغه آيةً بآية تلقائياً.`;
      }

      document.getElementById('tawilBody').innerHTML = `
        <div class="tawil-ayah-framed">{${ay.text}}[${shortSName}:${ay.numberInSurah}]</div>

    function shareSelectedAyah() {
      if (rangeStartAyah === null) return;
      const txt = getSelectedAyahsText() + '\nمن تطبيق: روح القرآن ونعيمه (@Rohalquraan_app_Bot)';
      if (navigator.share) navigator.share({ title: 'روح القرآن ونعيمه', text: txt });
      else { navigator.clipboard.writeText(txt); alert('تم نسخ الآيات المتتالية مع المصدر!'); }

    function saveAyahAsImage() {
      const txt = getSelectedAyahsText();
      if (!txt) return;
      const canvas = document.createElement('canvas');
      canvas.width = 1080; canvas.height = 1080;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f4f9f4'; ctx.fillRect(0, 0, 1080, 1080);
      ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 6; ctx.strokeRect(50, 50, 980, 980);
      ctx.fillStyle = '#1e2d24'; ctx.font = 'bold 42px "Amiri", serif'; ctx.textAlign = 'center';
      const words = txt.split(' '); let line = ''; let lines = [];
      words.forEach(w => { if (ctx.measureText(line + w + ' ').width > 860) { lines.push(line); line = w + ' '; } else line += w + ' '; });
      lines.push(line);
      let startY = 540 - (lines.length * 36);
      lines.forEach((l, i) => ctx.fillText(l.trim(), 540, startY + i * 74));
      ctx.fillStyle = '#2e7d32'; ctx.font = 'bold 30px "Tajawal", sans-serif';
      ctx.fillText('روح القرآن ونعيمه • @Rohalquraan_app_Bot', 540, 970);
      const link = document.createElement('a'); link.download = 'ayah.png'; link.href = canvas.toDataURL('image/png'); link.click();
    }

    /* البحث المخصص بالزر فقط مع ترقيم النتائج وروابط القفز المباشر للموضع */
    function renderSearchTab() {
      document.getElementById('mainView').innerHTML = `<div class="container">
        <h3 style="color:var(--primary);margin-bottom:6px;">🔍 المرشد الفهرسي الذكي (مرقّم وموثّق)</h3>
        <p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px;">اكتب الكلمة أو الآية ثم اضغط زر (بحث)؛ ستظهر لك جميع المواضع مرقمة مع رابط يفتح لك موضع الذكر مباشرة.</p>
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <input type="text" id="smartSearchInput" class="search-box" style="margin-bottom:0;flex:1;" placeholder="اكتب الكلمة أو الآية هنا..." onkeydown="if(event.key==='Enter')executeManualSearch()">
          <button class="tool-btn" type="button" style="padding:0 20px;font-size:0.95rem;" onclick="executeManualSearch()">🔍 بحث</button>
        </div>
        <div id="searchResults"></div></div>`;
    }

    function executeManualSearch() {
      const q = document.getElementById('smartSearchInput').value || '';
      const box = document.getElementById('searchResults');
      const cleanQ = normalizeAr(q.trim());
      if (cleanQ.length < 2) { box.innerHTML = '<p style="text-align:center;padding:16px;">يرجى كتابة كلمة من حرفين على الأقل ثم الضغط على زر بحث.</p>'; return; }
      const words = cleanQ.split(/\s+/).filter(w => w.length >= 2);
      let out = '';
      let idxCounter = 0;

      // 1. النتائج في القرآن الكريم
      for (const s of quranData) {
        for (const a of s.ayahs) {
          if (words.every(w => normalizeAr(a.text).includes(w))) {
            idxCounter++;
            out += `<div class="item-card" onclick="openSurah(${s.number}, ${a.numberInSurah})">
              <div class="badge-num">${idxCounter}</div>
              <div class="card-info">
                <div class="card-title">📖 ${s.name} • آية ${a.numberInSurah} (صفحة ${a.page})</div>
                <div class="card-sub" style="font-family:'Amiri Quran',serif;font-size:1.05rem;color:var(--text);">﴿ ${a.text} ﴾</div>
              </div>
              <span style="color:var(--primary);font-weight:700;white-space:nowrap;">فتح الآية ❯</span>
            </div>`;
            if (idxCounter >= 20) break;
          }
        }
        if (idxCounter >= 20) break;
      }

      // 2. النتائج في الكتب والمؤلفات
      for (const b of booksData) {
        const nt = normalizeAr(b.title); const nc = normalizeAr(b.content);
        if (words.every(w => nt.includes(w) || nc.includes(w))) {
          idxCounter++;
          const pos = nc.indexOf(words[0]);
          const snip = pos > -1 ? b.content.substring(Math.max(0, pos - 40), Math.min(b.content.length, pos + 160)) : b.summary;
          const firstRawWord = q.trim().split(/\s+/)[0];
          out += `<div class="item-card" onclick="openBookItem(${b.id}, '${firstRawWord}')">
            <div class="badge-num">${idxCounter}</div>
            <div class="card-info">
              <div class="card-title">📗 ${b.title}</div>
              <div class="card-sub" style="color:var(--primary);font-weight:700;">المصدر: ${b.category} (موضع حرفي مباشر)</div>
              <div class="card-sub">«...${snip}...»</div>
            </div>
            <span style="color:var(--primary);font-weight:700;white-space:nowrap;">فتح الموضع ❯</span>
          </div>`;
          if (idxCounter >= 50) break;
        }
      }

      box.innerHTML = out
        ? `<p style="font-size:0.85rem;color:var(--primary);font-weight:700;margin-bottom:10px;">تم العثور على (${idxCounter}) موضعاً مرقّماً — اضغط على أي نتيجة لفتح موضعها مباشرة:</p>` + out
        : '<p style="text-align:center;padding:20px;">لا توجد نتائج مطابقة.</p>';
    }

    function renderBookmarksTab() {
      const keys = Object.keys(savedHighlights);
      let html = `<div class="container"><h3 style="color:var(--primary);margin-bottom:12px;">🔖 الآيات الملونة (${keys.length})</h3>`;
      if (keys.length === 0) html += `<p style="color:var(--muted);padding:20px;text-align:center;">اضغط على أي آية أثناء تصفح المصحف واختر لون التمييز لتظهر هنا.</p>`;
      else {
        keys.forEach(k => {
          const [sNum, aNum] = k.split(':').map(Number);
          const s = quranData.find(x => x.number === sNum);
          const a = s ? s.ayahs.find(y => y.numberInSurah === aNum) : null;
          if (s && a) html += `<div class="item-card" onclick="openSurah(${s.number}, ${aNum})"><div class="badge-num">${s.number}</div><div class="card-info"><div class="card-title">${s.name} • آية ${aNum}</div><div class="card-sub">﴿ ${a.text} ﴾</div></div></div>`;
        });
      }
      document.getElementById('mainView').innerHTML = html + `</div>`;
    }

    loadAllData();
  </script>
</body>
</html>
