name: Generate Logo and Extract Full Content

on:
  push:
    paths:
      - '.github/workflows/setup.yml'
  workflow_dispatch:

jobs:
  build-assets-and-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python & Image Libraries
        run: pip install requests beautifulsoup4 lxml pillow cairosvg cloudscraper

      - name: Create Logo & Extract Full Library Content
        env:
          BOT_TOKEN: ${{ secrets.BO_TOKEN }}
          ADMIN_ID: "5205216077"
          CHANNEL_ID: "-1004482762316"
        run: |
          cat << 'EOF' > process_all.py
          import os, io, json, re
          import requests
          import cloudscraper
          from PIL import Image, ImageDraw
          import cairosvg

          TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          ADMIN_ID = os.environ.get("ADMIN_ID", "").strip()
          CHANNEL_ID = os.environ.get("CHANNEL_ID", "").strip()

          os.makedirs("assets", exist_ok=True)
          os.makedirs("data", exist_ok=True)

          def tg_msg(text):
              requests.post(
                  f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                  json={"chat_id": ADMIN_ID, "text": text, "parse_mode": "Markdown"},
                  timeout=15
              )

          def make_logo():
              # 1. التحقق مما إذا أرسل المستخدم الصورة الأصلية للبوت لتعديلها بدقتها الأصلية
              base_img = None
              try:
                  up = requests.get(f"https://api.telegram.org/bot{TOKEN}/getUpdates", timeout=15).json()
                  for item in reversed(up.get("result", [])):
                      msg = item.get("message") or {}
                      photos = msg.get("photo")
                      if photos:
                          file_id = photos[-1]["file_id"]
                          f_info = requests.get(f"https://api.telegram.org/bot{TOKEN}/getFile?file_id={file_id}", timeout=15).json()
                          f_path = f_info["result"]["file_path"]
                          img_bytes = requests.get(f"https://api.telegram.org/file/bot{TOKEN}/{f_path}", timeout=20).content
                          base_img = Image.open(io.BytesIO(img_bytes)).convert("RGBA")
                          break
              except Exception as e:
                  print("Photo fetch note:", e)

              if base_img:
                  w, h = base_img.size
                  draw = ImageDraw.Draw(base_img)
                  # مسح حرفي (ءة) فقط على يسار الجذع مع الحفاظ على (القر) والشجرة و(حياة) 100%
                  draw.rectangle([int(w * 0.05), int(h * 0.44), int(w * 0.415), int(h * 0.652)], fill=(255, 255, 255, 255))

                  # رسم حرف (ن) بنفس السماكة واللون البني الداكن (#3B2820)
                  brown = (59, 40, 32, 255)
                  stroke = max(int(w * 0.033), 10)
                  bbox = [int(w * 0.16), int(h * 0.48), int(w * 0.39), int(h * 0.638)]
                  draw.arc(bbox, start=0, end=180, fill=brown, width=stroke)
                  # قوائم حرف النون بحواف دائرية ناعمة
                  r_cap = stroke // 2
                  for cx in [bbox[0] + r_cap, bbox[2] - r_cap]:
                      draw.line([(cx, int(h * 0.525)), (cx, int(h * 0.565))], fill=brown, width=stroke)
                      draw.ellipse([cx - r_cap, int(h * 0.525) - r_cap, cx + r_cap, int(h * 0.525) + r_cap], fill=brown)

                  # نقطة النون في المنتصف
                  dot_r = int(w * 0.021)
                  dot_cx, dot_cy = int(w * 0.275), int(h * 0.495)
                  draw.ellipse([dot_cx - dot_r, dot_cy - dot_r, dot_cx + dot_r, dot_cy + dot_r], fill=brown)

                  out = base_img.convert("RGB")
                  out.save("assets/logo.png", "PNG", quality=100)
                  return True

              # 2. توليد فيكتور عالي الدقة في حال لم تُرسل الصورة بعد
              svg_code = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1024" height="1024">
                <rect width="1000" height="1000" fill="#FFFFFF"/>
                <!-- جذع الشجرة والأغصان -->
                <path d="M435 240 L435 655 M435 320 L385 265 M435 320 L485 265 M435 405 L380 350 M435 405 L490 350 M435 490 L380 435 M435 490 L490 435" stroke="#3B2820" stroke-width="24" stroke-linecap="round"/>
                <!-- الأوراق الخضراء السبع -->
                <path d="M435 245 C390 175 435 95 495 75 C515 145 485 220 435 245 Z" fill="#00B800"/>
                <path d="M385 265 C330 255 315 200 335 165 C380 185 400 230 385 265 Z" fill="#00B800"/>
                <path d="M485 265 C540 255 555 200 535 165 C490 185 470 230 485 265 Z" fill="#00B800"/>
                <path d="M380 350 C325 340 310 285 330 250 C375 270 395 315 380 350 Z" fill="#00B800"/>
                <path d="M490 350 C545 340 560 285 540 250 C495 270 475 315 490 350 Z" fill="#00B800"/>
                <path d="M380 435 C325 425 310 370 330 335 C375 355 395 400 380 435 Z" fill="#00B800"/>
                <path d="M490 435 C545 425 560 370 540 335 C495 355 475 400 490 435 Z" fill="#00B800"/>
                <!-- كلمة القرآن بالبني -->
                <path d="M865 475 L865 620 M800 475 L800 620 L605 620 M660 620 C660 515 745 515 745 620 M605 555 L605 620 C605 655 545 690 470 695" fill="none" stroke="#3B2820" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="680" cy="485" r="17" fill="#3B2820"/>
                <circle cx="728" cy="485" r="17" fill="#3B2820"/>
                <!-- حرف النون في القرآن -->
                <path d="M375 535 L375 580 C375 645 185 645 185 580 L185 535" fill="none" stroke="#3B2820" stroke-width="32" stroke-linecap="round"/>
                <circle cx="280" cy="495" r="19" fill="#3B2820"/>
                <!-- كلمة حياة بالأزرق -->
                <path d="M435 655 L435 825 L795 825 C785 735 710 725 660 765 M600 730 L600 825" fill="none" stroke="#0091D5" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="575" cy="872" r="18" fill="#0091D5"/>
                <circle cx="625" cy="872" r="18" fill="#0091D5"/>
                <circle cx="330" cy="775" r="52" fill="none" stroke="#0091D5" stroke-width="34"/>
                <circle cx="235" cy="750" r="18" fill="#00B800"/>
                <circle cx="235" cy="800" r="18" fill="#00B800"/>
              </svg>'''
              with open("assets/logo.svg", "w", encoding="utf-8") as f:
                  f.write(svg_code)
              cairosvg.svg2png(bytestring=svg_code.encode("utf-8"), write_to="assets/logo.png", output_width=1024, output_height=1024)
              return False

          used_original = make_logo()

          # إرسال الشعار الجديد للمطور وتعيينه صورة للقناة الخاصة تلقائياً
          with open("assets/logo.png", "rb") as f:
              requests.post(
                  f"https://api.telegram.org/bot{TOKEN}/sendPhoto",
                  data={"chat_id": ADMIN_ID, "caption": "🎨 *تم تجهيز شعار (القرآن حياة) بدقة عالية واعتماده للمشروع!*"},
                  files={"photo": f},
                  timeout=30
              )
          with open("assets/logo.png", "rb") as f:
              requests.post(
                  f"https://api.telegram.org/bot{TOKEN}/setChatPhoto",
                  data={"chat_id": CHANNEL_ID},
                  files={"photo": f},
                  timeout=30
              )

          # 3. سحب المحتوى الكامل للمقالات والكتب وتفاصيل المنتجات من واجهة الموقع البرمجية
          scraper = cloudscraper.create_scraper()
          full_books = []

          for ep, ctype in [
              ("https://www.amin-sheikho.com/wp-json/wp/v2/product?per_page=100", "كتاب / إصدار"),
              ("https://www.amin-sheikho.com/wp-json/wp/v2/posts?per_page=100", "مقالات ودراسات"),
              ("https://www.amin-sheikho.com/wp-json/wp/v2/pages?per_page=100", "أقسام ومواضيع")
          ]:
              try:
                  r = scraper.get(ep, timeout=25)
                  if r.status_code == 200:
                      for item in r.json():
                          title = (item.get("title") or {}).get("rendered", "")
                          content_html = (item.get("content") or {}).get("rendered", "")
                          excerpt_html = (item.get("excerpt") or {}).get("rendered", "")
                          link = item.get("link", "")
                          if title and (content_html or excerpt_html):
                              full_books.append({
                                  "id": item.get("id"),
                                  "type": ctype,
                                  "title": re.sub(r"<[^>]+>", "", title).strip(),
                                  "url": link,
                                  "excerpt": re.sub(r"<[^>]+>", "", excerpt_html).strip(),
                                  "content_html": content_html
                              })
              except Exception as e:
                  print("Fetch error:", ep, e)

          with open("data/full_content.json", "w", encoding="utf-8") as f:
              json.dump({"count": len(full_books), "items": full_books}, f, ensure_ascii=False, indent=2)

          tg_msg(
              f"✅ *تم تحديث الشعار وسحب النصوص الكاملة لـ {len(full_books)} كتاباً ومقالاً وقسماً من الموقع!*\n"
              "📌 كما تم تعيين شعار *(القرآن حياة)* صورة رسمية لقناتك الخاصة تلقائياً.\n"
              "🚀 الخطوة القادمة: إطلاق الواجهة التفاعلية للتطبيق المصغر (Mini App) لتعاينها مباشرة على التابلت!"
          )
          EOF
          python3 process_all.py

      - name: Commit Logo and Content
        run: |
          git config user.name "RohAlquranBot"
          git config user.email "bot@rohalquran.app"
          git add assets/ data/
          git diff --staged --quiet || git commit -m "Add Al-Quran Hayat logo and full content database"
          git push
