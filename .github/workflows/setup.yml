          def detect_fixed_book_num(fname):
              fn = fname.lower()
              if "01-08" in fn or "تبارك" in fn: return 81
              if "01-09" in fn or ("ج9" in fn and "عم" in fn): return 82
              if "01-12" in fn or "موسوعة-عم" in fn or "موسوعة_عم" in fn: return 83
              if "01-15" in fn or "الفيل" in fn: return 84
              if "01-14" in fn or "قريش" in fn: return 85
              if "01-13" in fn or "الماعون" in fn: return 86
              if "01-16" in fn or "الهمزة" in fn: return 87
              if "01-10" in fn or "تأويل-الأمين" in fn: return 88
              if "01-11" in fn or "السبع-المثاني" in fn: return 89
              if "01_00" in fn or "01-00" in fn or "جميع_المجلدات" in fn or "جميع-المجلدات" in fn: return 90
              if "03-01" in fn or "زيارة-الرسول" in fn: return 91
              if "03-02" in fn or "حقيقة-سيدنا-محمد" in fn: return 92
              if "03-03" in fn or "السيد-المسيح" in fn: return 93
              return None

          def clean_and_format_chapter_html(raw_html, ch_title="", is_qa_book=False):
              if not raw_html: return "", ""
              soup = BeautifulSoup(raw_html, "lxml")
              raw_lines = [p.get_text(" ", strip=True) for p in soup.find_all(["p", "h1", "h2", "h3", "h4", "li", "div"]) if p.get_text(" ", strip=True)]
              if not raw_lines:
                  raw_lines = [ln.strip() for ln in soup.get_text("\n").split("\n") if ln.strip()]

              merged_lines = []
              i = 0
              while i < len(raw_lines):
                  curr = raw_lines[i].strip()
                  if i == 0 and ch_title and curr == ch_title.strip():
                      i += 1
                      continue
                  if i + 2 < len(raw_lines) and raw_lines[i+1] in [")", "("] and re.match(r'^\d+$', raw_lines[i+2]):
                      num_val = raw_lines[i+2]
                      curr = f"{curr} ﴿{num_val}﴾"
                      i += 4 if (i + 3 < len(raw_lines) and raw_lines[i+3] in [")", "("]) else 3
                      merged_lines.append(curr)
                      continue
                  if re.match(r'^[\(\)\[\]﴿﴾\d\s]{1,6}$', curr):
                      num_m = re.search(r'(\d+)', curr)
                      if num_m and merged_lines:
                          merged_lines[-1] = re.sub(r'[\(\)]$', '', merged_lines[-1]).strip() + f" ﴿{num_m.group(1)}﴾"
                      i += 1
                      continue
                  curr = re.sub(r'[\)\(]\s*(\d{1,3})\s*[\)\(]', r' ﴿\1﴾ ', curr)
                  curr = re.sub(r'\s+', ' ', curr).strip()
                  if merged_lines and merged_lines[-1] == curr:
                      i += 1
                      continue
                  merged_lines.append(curr)
                  i += 1

              formatted_blocks = []
              for ln in merged_lines:
                  if is_qa_book or re.match(r'^(سؤال|السؤال|س\s*[:\-]|Question)', ln, re.I):
                      if re.match(r'^(سؤال|السؤال|س\s*[:\-]|Question)', ln, re.I) or (is_qa_book and "؟" in ln and len(ln) < 220):
                          formatted_blocks.append(f'<div class="qa-question">❓ {ln}</div>')
                          continue
                      elif re.match(r'^(جواب|الجواب|ج\s*[:\-]|الإجابة|Answer|Réponse)', ln, re.I):
                          formatted_blocks.append(f'<div class="qa-answer">💡 {ln}</div><hr class="qa-divider"/>')
                          continue
                  if len(ln) < 80 and any(ln.startswith(k) for k in ["سورة ", "الفصل ", "الباب ", "المبحث ", "تمهيد", "مقدمة", "Chapitre", "Chapter", "Sourate", "Surah"]):
                      formatted_blocks.append(f'<h3>{ln}</h3>')
                  else:
                      if is_qa_book:
                          formatted_blocks.append(f'<div class="qa-answer">{ln}</div><hr class="qa-divider"/>')
                      else:
                          formatted_blocks.append(f'<p>{ln}</p>')

              return "\n".join(formatted_blocks), " ".join(merged_lines)

          catalog_path = "data/user_books_catalog.json"
          if os.path.exists(catalog_path):
              with open(catalog_path, "r", encoding="utf-8") as f:
                  catalog_state = json.load(f)
          else:
              catalog_state = {"next_num": 94, "scanned_msg_ids": [], "file_hashes": {}, "books": []}

          scanned_set = set(catalog_state.get("scanned_msg_ids", []))
          books_list = catalog_state.get("books", [])

          # جمع الرسائل الجديدة من getUpdates + فحص آخر 90 رسالة في المحادثة لالتقاط الملفات الـ 13 الجديدة
          candidate_docs = []
          up_res = requests.get(f"https://api.telegram.org/bot{TOKEN}/getUpdates?limit=100", timeout=25).json()
          for u in up_res.get("result", []):
              msg = u.get("message") or u.get("channel_post") or {}
              mid = msg.get("message_id")
              doc = msg.get("document")
              if doc and mid and mid not in scanned_set:
                  candidate_docs.append((mid, doc, (msg.get("caption") or "").strip()))

          if latest_mid and latest_mid > 1:
              for mid in range(max(1, latest_mid - 90), latest_mid):
                  if mid in scanned_set:
                      continue
                  try:
                      fw = requests.post(
                          f"https://api.telegram.org/bot{TOKEN}/forwardMessage",
                          json={"chat_id": ADMIN_ID, "from_chat_id": ADMIN_ID, "message_id": mid, "disable_notification": True},
                          timeout=10
                      ).json()
                      if fw.get("ok"):
                          res_msg = fw["result"]
                          tmid = res_msg.get("message_id")
                          if tmid:
                              requests.post(f"https://api.telegram.org/bot{TOKEN}/deleteMessage", json={"chat_id": ADMIN_ID, "message_id": tmid}, timeout=8)
                          doc = res_msg.get("document")
                          if doc:
                              candidate_docs.append((mid, doc, (res_msg.get("caption") or "").strip()))
                          else:
                              scanned_set.add(mid)
                      else:
                          scanned_set.add(mid)
                  except Exception:
                      pass

          # نرتب الملفات بحيث نعطي الأولوية لملفات EPUB قبل PDF لنفس الكتاب
          candidate_docs.sort(key=lambda x: (0 if (x[1].get("file_name") or "").lower().endswith(".epub") else 1, x[0]))

          new_books_added = []
          for mid, doc, caption in candidate_docs:
              scanned_set.add(mid)
              fname = doc.get("file_name") or "book"
              fsize = doc.get("file_size", 0)
              fid = doc.get("file_id")
              if not (fname.lower().endswith(".epub") or fname.lower().endswith(".pdf")) or fsize >= 19950000:
                  continue

              fixed_num = detect_fixed_book_num(fname)
              # إذا كان الكتاب من الـ 13 كتاباً الجديدة وموجوداً مسبقاً بصيغة EPUB نتخطى نسخة الـ PDF المكررة له
              if fixed_num and os.path.exists(f"data/user_books/{fixed_num}.json") and fname.lower().endswith(".pdf"):
                  continue

              try:
                  finfo = requests.get(f"https://api.telegram.org/bot{TOKEN}/getFile?file_id={fid}", timeout=20).json()
                  fpath = (finfo.get("result") or {}).get("file_path")
                  if not fpath: continue
                  raw_bytes = requests.get(f"https://api.telegram.org/file/bot{TOKEN}/{fpath}", timeout=55).content
              except Exception:
                  continue

              ext = "epub" if fname.lower().endswith(".epub") else "pdf"
              chapters = []
              if ext == "epub":
                  try:
                      with zipfile.ZipFile(io.BytesIO(raw_bytes), 'r') as z:
                          html_files = sorted([n for n in z.namelist() if n.lower().endswith(('.xhtml', '.html', '.htm'))])
                          for idx, hf in enumerate(html_files, 1):
                              r_html = z.read(hf).decode('utf-8', errors='ignore')
                              sp = BeautifulSoup(r_html, 'lxml')
                              for t in sp(['script', 'style', 'head', 'nav']): t.decompose()
                              h_tags = [h.get_text(strip=True) for h in sp.find_all(['h1', 'h2', 'h3']) if h.get_text(strip=True)]
                              ctitle = h_tags[0] if h_tags else f"الفصل {idx}"
                              ch_html, ch_plain = clean_and_format_chapter_html(str(sp.body or sp), ctitle, False)
                              if len(ch_plain) > 20:
                                  chapters.append({"idx": len(chapters)+1, "title": ctitle[:75], "html": ch_html})
                  except Exception:
                      pass
              else:
                  try:
                      pdf_doc = fitz.open(stream=raw_bytes, filetype="pdf")
                      total_p = len(pdf_doc)
                      for start_p in range(0, total_p, 8):
                          end_p = min(total_p, start_p + 8)
                          p_html_list = []
                          for pno in range(start_p, end_p):
                              pt = pdf_doc[pno].get_text("text").strip()
                              if pt:
                                  p_html_list.append("".join(f"<p>{ln}</p>" for ln in pt.split("\n") if ln.strip()))
                          if p_html_list:
                              ch_html, _ = clean_and_format_chapter_html("\n".join(p_html_list), "", False)
                              chapters.append({"idx": len(chapters)+1, "title": f"صفحة {start_p+1} - {end_p}", "html": ch_html})
                  except Exception:
                      pass

              if not chapters:
                  continue

              bnum = fixed_num if fixed_num else max(catalog_state.get("next_num", 94), 94)
              if not fixed_num:
                  catalog_state["next_num"] = bnum + 1

              c_lang, c_cat, c_title, c_order = CURATED_MAP.get(bnum, ("ar", "الكتب المرفوعة", fname, 50))

              # تحديث أو إضافة في قائمة الكتب
              books_list = [b for b in books_list if int(b["num"]) != bnum]
              books_list.append({
                  "num": bnum,
                  "title": c_title,
                  "lang": c_lang,
                  "category": c_cat,
                  "sort_order": c_order,
                  "cover": "",
                  "format": ext,
                  "chapters_count": len(chapters)
              })

              with open(f"data/user_books/{bnum}.json", "w", encoding="utf-8") as bf:
                  json.dump({"num": bnum, "title": c_title, "lang": c_lang, "category": c_cat, "chapters": chapters}, bf, ensure_ascii=False)

              new_books_added.append(f"✅ [#{bnum}] {c_title} ({len(chapters)} فصل)")

          # تحديث جميع الكتب وبناء كشاف البحث والتأويل الشامل (بما فيه ملف التأويل المدمج #90)
          SURAH_NAMES_AR = [
              "الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس",
              "هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه",
              "الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
              "لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر",
              "فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق",
              "الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة",
              "الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج",
              "نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس",
              "التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد",
              "الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات",
              "القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر",
              "المسد","الإخلاص","الفلق","الناس"
          ]

          search_index = []
          tafsir_db = {"ar": {}, "fr": {}, "en": {}}

          for b in books_list:
              bnum = int(b["num"])
              if bnum in CURATED_MAP:
                  b["lang"], b["category"], b["title"], b["sort_order"] = CURATED_MAP[bnum]

              bfile = f"data/user_books/{bnum}.json"
              if os.path.exists(bfile):
                  try:
                      with open(bfile, "r", encoding="utf-8") as bf:
                          bdata = json.load(bf)
                      is_qa = (bnum == 3)
                      new_chaps = []
                      for ch in bdata.get("chapters", []):
                          ch_t = ch.get("title", "")
                          fixed_h, plain_t = clean_and_format_chapter_html(ch.get("html", ""), ch_t, is_qa)
                          ch["html"] = fixed_h
                          new_chaps.append(ch)

                          for para in plain_t.split("."):
                              pc = para.strip()
                              if len(pc) > 25:
                                  search_index.append({"b": bnum, "c": ch["idx"]-1, "l": b["lang"], "t": pc[:250]})

                          if bnum in [28, 29, 30, 31, 32, 33, 34, 81, 82, 83, 84, 85, 86, 87, 88, 89, 90]:
                              for s_idx, s_name in enumerate(SURAH_NAMES_AR, 1):
                                  if f"سورة {s_name}" in ch_t or f"سورة {s_name}" in plain_t[:220]:
                                      prev = tafsir_db["ar"].get(str(s_idx), "")
                                      if len(prev) < 8000:
                                          tafsir_db["ar"][str(s_idx)] = (prev + f"\n<h4>{b['title']} ({ch_t}):</h4>\n" + fixed_h)[:12000]

                      bdata["chapters"] = new_chaps
                      with open(bfile, "w", encoding="utf-8") as bf:
                          json.dump(bdata, bf, ensure_ascii=False)
                  except Exception:
                      pass

          catalog_state["scanned_msg_ids"] = sorted(list(scanned_set))[-1000:]
          catalog_state["books"] = sorted(books_list, key=lambda x: (x.get("sort_order", 50), x["num"]))

          with open(catalog_path, "w", encoding="utf-8") as f:
              json.dump(catalog_state, f, ensure_ascii=False, indent=2)
          with open("data/books_search_index.json", "w", encoding="utf-8") as f:
              json.dump(search_index[:18000], f, ensure_ascii=False)
          with open("data/tawil_multilang.json", "w", encoding="utf-8") as f:
              json.dump(tafsir_db, f, ensure_ascii=False)

          msg_summary = [f"🎉 اكتمل تحديث وتنسيق الكتب بنجاح! (إجمالي الكتب في التطبيق الآن: {len(books_list)} كتاباً)"]
          if new_books_added:
              msg_summary.append("\n📚 الكتب الجديدة التي تم سحبها ودمجها من رسائلك:")
              msg_summary.extend(new_books_added)
          send_tg("\n".join(msg_summary))
          EOF

      - name: Commit Updated Books & Tafsir Index
        run: |
          git config user.name "RohAlquranBot"
          git config user.email "bot@rohalquran.app"
          git add data/
          git diff --staged --quiet || (git commit -m "Add 13 new books (81-93), extract merged Tafsir & fix formatting" && git pull --rebase origin main && git push)
