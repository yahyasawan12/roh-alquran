          ADMIN_ID = str(os.environ.get("ADMIN_ID", "5205216077")).strip()

          def send_tg(text):
              last_mid = None
              for i in range(0, len(text), 3800):
                  try:
                      r = requests.post(
                          f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                          json={"chat_id": ADMIN_ID, "text": text[i:i+3800]},
                          timeout=20
                      ).json()
                      if r.get("ok"):
                          last_mid = r["result"]["message_id"]
                  except Exception:
                      pass
              return last_mid

