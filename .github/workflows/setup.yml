name: Deep Scan Library Vault

on:
  push:
    paths:
      - '.github/workflows/setup.yml'
  workflow_dispatch:

jobs:
  deep-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Deep Scan WordPress Media & Audio Playlists
        env:
          BOT_TOKEN: ${{ secrets.BO_TOKEN }}
          ADMIN_ID: "5205216077"
        run: |
          cat << 'EOF' > deep_scan.py
          import os, json, re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import unquote

          TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          ADMIN_ID = os.environ.get("ADMIN_ID", "").strip()
          headers = {"User-Agent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36"}

          def tg_msg(text):
              requests.post(
                  f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                  json={"chat_id": ADMIN_ID, "text": text, "parse_mode": "Markdown"},
                  timeout=15
              )

          def tg_doc(filepath, caption):
              with open(filepath, "rb") as f:
                  requests.post(
                      f"https://api.telegram.org/bot{TOKEN}/sendDocument",
                      data={"chat_id": ADMIN_ID, "caption": caption},
                      files={"document": f},
                      timeout=30
                  )

          tg_msg("🔍 *بدأ الآن الفحص العميق لمخزن الوسائط الخلفي ومشغلات الصوت...*")

          found_pdfs = set()
          found_epubs = set()
          found_audios = set()
          store_links = set()

          # 1. فحص مخزن وسائط ووردبريس الخلفي مباشرة (Media API)
          for page in range(1, 15):
              try:
                  r = requests.get(
                      f"https://www.amin-sheikho.com/wp-json/wp/v2/media?per_page=100&page={page}",
                      headers=headers, timeout=15
                  )
                  if r.status_code != 200:
                      break
                  media_items = r.json()
                  if not isinstance(media_items, list) or not media_items:
                      break
                  for m in media_items:
                      src = m.get("source_url", "")
                      low = src.lower()
                      if low.endswith(".pdf"):
                          found_pdfs.add(src)
                      elif low.endswith(".epub"):
                          found_epubs.add(src)
                      elif low.endswith((".mp3", ".m4a", ".wav", ".ogg")):
                          found_audios.add(src)
              except Exception as e:
                  break

          # 2. فحص الكود المصدري الخام للصفحات ومشغلات الصوت المخفية
          if os.path.exists("data/library.json"):
              with open("data/library.json", "r", encoding="utf-8") as f:
                  lib = json.load(f)
              items = lib.get("items", [])
          else:
              items = []

          sample_html_info = []
          for idx, item in enumerate(items[:60]):
              url = item.get("url", "")
              if not url:
                  continue
              try:
                  resp = requests.get(url, headers=headers, timeout=12)
                  raw = resp.text.replace(r"\/", "/")

                  for match in re.findall(r'https?://[^\s"\'<>\\]+\.(?:pdf|epub|mp3|m4a)', raw, re.I):
                      low = match.lower()
                      if low.endswith(".pdf"):
                          found_pdfs.add(match)
                          item.setdefault("pdf", []).append(match)
                      elif low.endswith(".epub"):
                          found_epubs.add(match)
                          item.setdefault("epub", []).append(match)
                      elif low.endswith((".mp3", ".m4a")):
                          found_audios.add(match)
                          item.setdefault("audio", []).append({"url": match})

                  # فحص الروابط الخارجية أو أزرار التحميل داخل الصفحة
                  for ext in re.findall(r'https?://(?:play\.google\.com|books\.apple\.com|drive\.google\.com|archive\.org|soundcloud\.com)[^\s"\'<>\\]+', raw, re.I):
                      store_links.add(ext)

                  if idx < 3:
                      soup = BeautifulSoup(resp.text, "lxml")
                      btns = [a.get("href", "") for a in soup.find_all("a", href=True) if any(w in a.get_text() or w in a.get("href", "") for w in ["تحميل", "download", "add-to-cart", "سلة", "غوغل", "play", "epub", "pdf"])]
                      sample_html_info.append({"title": item.get("title"), "url": url, "buttons": btns[:10]})
              except Exception:
                  pass

          vault_report = {
              "pdfs": list(found_pdfs),
              "epubs": list(found_epubs),
              "audios": list(found_audios),
              "external_stores": list(store_links),
              "sample_buttons": sample_html_info
          }

          os.makedirs("data", exist_ok=True)
          with open("data/vault_scan.json", "w", encoding="utf-8") as f:
              json.dump(vault_report, f, ensure_ascii=False, indent=2)

          msg = (
              "✅ *نتيجة الفحص العميق لمخزن الموقع الخلفي:*\n\n"
              f"📄 *ملفات PDF المباشرة:* {len(found_pdfs)}\n"
              f"📱 *ملفات ePUB المباشرة:* {len(found_epubs)}\n"
              f"🎧 *المقاطع الصوتية المباشرة (MP3):* {len(found_audios)}\n"
              f"🔗 *روابط المتاجر والمنصات المرتبطة:* {len(store_links)}\n\n"
              "📎 مرفق ملف (`vault_scan.json`) وفيه الروابط المكتشفة وطريقة عمل أزرار التحميل في الموقع."
          )
          tg_msg(msg)
          tg_doc("data/vault_scan.json", "تقرير الفحص العميق للروابط والملفات")
          EOF
          python3 deep_scan.py

      - name: Save Vault Scan
        run: |
          git config user.name "RohAlquranBot"
          git config user.email "bot@rohalquran.app"
          git add data/
          git diff --staged --quiet || git commit -m "Add deep vault scan results"
          git push
