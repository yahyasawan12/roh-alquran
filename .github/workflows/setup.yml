              # 🇬🇧 الكتب الإنجليزية - Stories of the Scholar Mohammad Amin Sheikho
              48: ("en", "Stories of the Scholar Mohammad Amin Sheikho", "Stories of the Scholar Mohammad Amin Sheikho (His Life, His Deeds, His Way to Allah)", 1),
              60: ("en", "Stories of the Scholar Mohammad Amin Sheikho", "Stories of the Scholar Mohammad Amin Sheikho - Part 1", 2),
              59: ("en", "Stories of the Scholar Mohammad Amin Sheikho", "Stories of the Scholar Mohammad Amin Sheikho - Part 2", 3),
              44: ("en", "Stories of the Scholar Mohammad Amin Sheikho", "Stories of the Scholar Mohammad Amin Sheikho - Part 3", 4),
              45: ("en", "Stories of the Scholar Mohammad Amin Sheikho", "Stories of the Scholar Mohammad Amin Sheikho - Part 4", 5),
