name: Setup and Test Bot

on:
  push:
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Telegram Bot & Channel Connection
        env:
          BOT_TOKEN: ${{ secrets.BO_TOKEN }}
          ADMIN_ID: "5205216077"
          CHANNEL_ID: "-1004482762316"
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          token = os.environ.get("BOT_TOKEN", "").strip()
          admin_id = os.environ.get("ADMIN_ID", "").strip()
          channel_id = os.environ.get("CHANNEL_ID", "").strip()

          def tg_api(method, data=None):
              url = f"https://api.telegram.org/bot{token}/{method}"
              req = urllib.request.Request(url, headers={"Content-Type": "application/json"})
              if data:
                  req.data = json.dumps(data).encode("utf-8")
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except Exception as e:
                  return {"ok": False, "error": str(e)}

          msg = (
              "✅ *تم ربط مشروع (روح القرآن ونعيمه) بنجاح!*\n\n"
              "🤖 البوت متصل الآن مع مستودع GitHub السحابي.\n"
              "📚 الخطوة التالية: تجهيز وسحب فهارس الكتب والصوتيات آلياً."
          )

          res_admin = tg_api("sendMessage", {"chat_id": admin_id, "text": msg, "parse_mode": "Markdown"})
          print("Send to Admin:", res_admin)

          res_chan = tg_api("sendMessage", {"chat_id": channel_id, "text": msg, "parse_mode": "Markdown"})
          print("Send to Channel:", res_chan)

          if not res_chan.get("ok"):
              updates = tg_api("getUpdates")
              for u in reversed(updates.get("result", [])):
                  chat = (u.get("channel_post") or u.get("my_chat_member") or {}).get("chat", {})
                  if chat.get("type") == "channel":
                      real_id = str(chat.get("id"))
                      tg_api("sendMessage", {"chat_id": real_id, "text": msg + f"\n\n📌 معرف القناة الدقيق: `{real_id}`", "parse_mode": "Markdown"})
                      tg_api("sendMessage", {"chat_id": admin_id, "text": f"📌 تم اكتشاف معرف القناة الدقيق تلقائياً: `{real_id}`", "parse_mode": "Markdown"})
                      break
          EOF
