              40: ("en", "Stories of the Scholar Mohammad Amin Sheikho", "Stories of the Scholar Mohammad Amin Sheikho - Part 8", 9),

              # 🇫🇷 الكتب الفرنسية - Interprétation du Saint Coran
              73: ("fr", "Interprétation du Saint Coran", "Interprétation de la Sourate Al-Baqara", 1),
              61: ("fr", "Interprétation du Saint Coran", "Interprétation de la Sourate Al-Imrân", 2),
              80: ("fr", "Interprétation du Saint Coran", "Interprétation de la Sourate An-Nissâ", 3),
              78: ("fr", "Interprétation du Saint Coran", "Interprétation de la Sourate Prophète Joseph (Youssef)", 4),
              77: ("fr", "Interprétation du Saint Coran", "Interprétation de la Sourate Al-Kahf", 5),
              79: ("fr", "Interprétation du Saint Coran", "Interprétation de la Sourate Yâ-Sîne", 6),
              74: ("fr", "Interprétation du Saint Coran", "Interprétation de la Partie 29 (Juz’ Tabarak)", 7),
              69: ("fr", "Interprétation du Saint Coran", "Interprétation de la Partie 30 (Juz’ Amma)", 8),

              # 🇫🇷 الكتب الفرنسية - Les Piliers de l'Islam
              72: ("fr", "Les Piliers de l'Islam", "La Vérité de la Prière (As-Salât)", 1),
              71: ("fr", "Les Piliers de l'Islam", "L'Aumône (Az-Zakât)", 2),
              70: ("fr", "Les Piliers de l'Islam", "Le Pèlerinage (Al-Hajj)", 3),

              # 🇫🇷 الكتب الفرنسية - Études Islamiques
              75: ("fr", "Études Islamiques", "Le Monde Pré-Matériel", 1),
              68: ("fr", "Études Islamiques", "Dévoiler les Secrets de la Magie et des Magiciens", 2),

              # 🇫🇷 الكتب الفرنسية - Études Scientifiques
              62: ("fr", "Études Scientifiques", "Les Origines des Eaux de Source dans le Monde", 1),
              76: ("fr", "Études Scientifiques", "Proclamer l'Amour de Dieu", 2),
              64: ("fr", "Études Scientifiques", "Le Bonheur, Est-il vraiment hors de portée ?", 3),

              # 🇫🇷 الكتب الفرنسية - Programmes Pédagogiques
              63: ("fr", "Programmes Pédagogiques", "Éducation Islamique pour la Jeunesse - Niveau 1", 1),
              67: ("fr", "Programmes Pédagogiques", "Éducation Islamique pour la Jeunesse - Niveau 2", 2),
              65: ("fr", "Programmes Pédagogiques", "Éducation Islamique pour la Jeunesse - Niveau 3", 3),
              66: ("fr", "Programmes Pédagogiques", "Faits de Psychologie et de Sociologie", 4)
          }

          # ================== 2. دالة تنظيف وإصلاح تنسيق النصوص (إصلاح الأقواس المقطعة وتنسيق سؤال وجواب) ==================
          def clean_and_format_chapter_html(raw_html, ch_title="", is_qa_book=False):
              if not raw_html:
                  return "", ""
              soup = BeautifulSoup(raw_html, "lxml")
              raw_lines = [p.get_text(" ", strip=True) for p in soup.find_all(["p", "h1", "h2", "h3", "h4", "li", "div"]) if p.get_text(" ", strip=True)]
              if not raw_lines:
                  raw_lines = [ln.strip() for ln in soup.get_text("\n").split("\n") if ln.strip()]

              # دمج الأسطر المقطعة بالخطأ (مثل القوس المنفرد ')' أو الرقم المنفرد '1' أو '(' كما في صورة سورة الهمزة)
              merged_lines = []
              i = 0
              while i < len(raw_lines):
                  curr = raw_lines[i].strip()
                  # تخطي العنوان المكرر في أول الفصل
                  if i == 0 and ch_title and curr == ch_title.strip():
                      i += 1
                      continue

                  # إذا كان السطر التالي عبارة عن قوس أو رقم آية مقطوع: ) ثم 1 ثم (
                  if i + 2 < len(raw_lines) and raw_lines[i+1] in [")", "("] and re.match(r'^\d+$', raw_lines[i+2]):
                      num_val = raw_lines[i+2]
                      curr = f"{curr} ﴿{num_val}﴾"
                      i += 4 if (i + 3 < len(raw_lines) and raw_lines[i+3] in [")", "("]) else 3
                      merged_lines.append(curr)
                      continue

                  # إذا كان السطر الحالي قوساً منفرداً أو رقماً منفرداً ندمجه مع السطر السابق
                  if re.match(r'^[\(\)\[\]﴿﴾\d\s]{1,6}$', curr):
                      num_m = re.search(r'(\d+)', curr)
                      if num_m and merged_lines:
                          merged_lines[-1] = re.sub(r'[\(\)]$', '', merged_lines[-1]).strip() + f" ﴿{num_m.group(1)}﴾"
                      i += 1
                      continue

                  # إصلاح الأقواس المعكوسة داخل السطر نفسه مثل ) 1 ( أو ( 1 )
                  curr = re.sub(r'[\)\(]\s*(\d{1,3})\s*[\)\(]', r' ﴿\1﴾ ', curr)
                  curr = re.sub(r'\s+', ' ', curr).strip()

                  if merged_lines and merged_lines[-1] == curr:
                      i += 1
                      continue

                  merged_lines.append(curr)
                  i += 1

              # بناء HTML أنيق جداً (مع تنسيق خاص لكتاب سؤال وجواب #3)
              formatted_blocks = []
              for ln in merged_lines:
                  if is_qa_book or re.match(r'^(سؤال|السؤال|س\s*[:\-]|س\d*\s*[:\-]|Question\s*[:\-])', ln, re.I):
                      if re.match(r'^(سؤال|السؤال|س\s*[:\-]|س\d*\s*[:\-]|Question)', ln, re.I) or (is_qa_book and "؟" in ln and len(ln) < 220):
                          formatted_blocks.append(f'<div class="qa-question">❓ {ln}</div>')
                          continue
                      elif re.match(r'^(جواب|الجواب|ج\s*[:\-]|الإجابة|Answer|Réponse)', ln, re.I):
                          formatted_blocks.append(f'<div class="qa-answer">💡 {ln}</div><hr class="qa-divider"/>')
                          continue

                  if len(ln) < 80 and any(ln.startswith(k) for k in ["سورة ", "الفصل ", "الباب ", "المبحث ", "تمهيد", "مقدمة", "Chapitre", "Chapter", "Sourate", "Surah"]):
                      formatted_blocks.append(f'<h3>{ln}</h3>')
                  else:
                      if is_qa_book:
                          formatted_blocks.append(f'<div class="qa-answer">{ln}</div><hr class="qa-divider"/>')
                      else:
                          formatted_blocks.append(f'<p>{ln}</p>')

              clean_html = "\n".join(formatted_blocks)
              plain_text = " ".join(merged_lines)
              return clean_html, plain_text

          # ================== 3. قراءة الكتالوج الحالي واستقبال أي ملفات جديدة أرسلها المستخدم للبوت/القناة ==================
          catalog_path = "data/user_books_catalog.json"
          if os.path.exists(catalog_path):
              with open(catalog_path, "r", encoding="utf-8") as f:
                  catalog_state = json.load(f)
          else:
              catalog_state = {"next_num": 81, "scanned_msg_ids": [], "file_hashes": {}, "books": []}

          scanned_set = set(catalog_state.get("scanned_msg_ids", []))
          books_list = catalog_state.get("books", [])

          def clean_book_name_str(s):
              s = re.sub(r'\.(pdf|epub|docx)$', '', str(s), flags=re.I)
              s = re.sub(r'^[0-9_\-\s]+', '', s)
              s = s.replace('_', ' ').replace('-', ' - ')
              return re.sub(r'\s+', ' ', s).strip()

          # فحص الرسائل الجديدة في getUpdates لاستلام الكتب الناقصة التي أرسلها المستخدم الآن
          up_res = requests.get(f"https://api.telegram.org/bot{TOKEN}/getUpdates?limit=100", timeout=25).json()
          new_books_report = []

          for u in up_res.get("result", []):
              msg = u.get("message") or u.get("channel_post") or {}
              mid = msg.get("message_id")
              doc = msg.get("document")
              if not doc or not mid or mid in scanned_set:
                  continue
              scanned_set.add(mid)

              fname = doc.get("file_name") or "book"
              fsize = doc.get("file_size", 0)
              fid = doc.get("file_id")
              if not (fname.lower().endswith(".epub") or fname.lower().endswith(".pdf")) or fsize >= 19950000:
                  continue

              try:
                  finfo = requests.get(f"https://api.telegram.org/bot{TOKEN}/getFile?file_id={fid}", timeout=20).json()
                  fpath = (finfo.get("result") or {}).get("file_path")
                  if not fpath: continue
                  raw_bytes = requests.get(f"https://api.telegram.org/file/bot{TOKEN}/{fpath}", timeout=50).content
              except Exception:
                  continue

              fhash = hashlib.sha256(raw_bytes).hexdigest()
              if fhash in catalog_state["file_hashes"]:
                  continue

              ext = "epub" if fname.lower().endswith(".epub") else "pdf"
              chapters = []
              extracted_title = clean_book_name_str(fname)

              if ext == "epub":
                  try:
                      with zipfile.ZipFile(io.BytesIO(raw_bytes), 'r') as z:
                          html_files = sorted([n for n in z.namelist() if n.lower().endswith(('.xhtml', '.html', '.htm'))])
                          for idx, hf in enumerate(html_files, 1):
                              r_html = z.read(hf).decode('utf-8', errors='ignore')
                              sp = BeautifulSoup(r_html, 'lxml')
                              for t in sp(['script', 'style', 'head', 'nav']): t.decompose()
                              h_tags = [h.get_text(strip=True) for h in sp.find_all(['h1', 'h2', 'h3']) if h.get_text(strip=True)]
                              ctitle = h_tags[0] if h_tags else f"الفصل {idx}"
                              ch_html, ch_plain = clean_and_format_chapter_html(str(sp.body or sp), ctitle, False)
                              if len(ch_plain) > 20:
                                  chapters.append({"idx": len(chapters)+1, "title": ctitle[:70], "html": ch_html})
                  except Exception:
                      pass
              else:
                  try:
                      pdf_doc = fitz.open(stream=raw_bytes, filetype="pdf")
                      total_p = len(pdf_doc)
                      for start_p in range(0, total_p, 10):
                          end_p = min(total_p, start_p + 10)
                          p_html_list = []
                          for pno in range(start_p, end_p):
                              pt = pdf_doc[pno].get_text("text").strip()
                              if pt:
                                  p_html_list.append("".join(f"<p>{ln}</p>" for ln in pt.split("\n") if ln.strip()))
                          if p_html_list:
                              ch_html, _ = clean_and_format_chapter_html("\n".join(p_html_list), "", False)
                              chapters.append({"idx": len(chapters)+1, "title": f"صفحة {start_p+1} - {end_p}", "html": ch_html})
                  except Exception:
                      pass

              if not chapters:
                  continue

              bnum = max(catalog_state.get("next_num", 81), max([b["num"] for b in books_list] + [80]) + 1)
              catalog_state["next_num"] = bnum + 1
              catalog_state["file_hashes"][fhash] = bnum

              caption = (msg.get("caption") or "").strip()
              if caption: extracted_title = caption

              sample_txt = " ".join(c["html"][:300] for c in chapters[:2])
              ar_cnt = len(re.findall(r'[\u0600-\u06FF]', extracted_title + sample_txt))
              lang = "ar" if ar_cnt > 15 else ("fr" if re.search(r'[éèêàùç]|interprétation|islamique', (extracted_title+sample_txt).lower()) else "en")

              books_list.append({
                  "num": bnum,
                  "title": extracted_title,
                  "lang": lang,
                  "category": "كتب جديدة بانتظار التصنيف",
                  "sort_order": 99,
                  "cover": "",
                  "format": ext,
                  "chapters_count": len(chapters)
              })
              with open(f"data/user_books/{bnum}.json", "w", encoding="utf-8") as bf:
                  json.dump({"num": bnum, "title": extracted_title, "lang": lang, "chapters": chapters}, bf, ensure_ascii=False)

              new_books_report.append(f"🆕 رقم [#{bnum}] : {extracted_title} ({lang.upper()} - {len(chapters)} فصل)")

          # ================== 4. سحب صور الأغلفة الرسمية من الموقع ومطابقتها تلقائياً ==================
          api_books = []
          if os.path.exists("data/api_v1_books.json"):
              with open("data/api_v1_books.json", "r", encoding="utf-8") as f:
                  api_books = [b for b in json.load(f).get("data", []) if not b.get("is_audio")]

          def norm_match(s):
              s = re.sub(r'[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]', '', str(s))
              s = re.sub(r'[أإآٱ]', 'ا', s)
              s = re.sub(r'ة', 'ه', s)
              s = re.sub(r'[^\w\s]', ' ', s).lower()
              return re.sub(r'\s+', ' ', s).strip()

          # ================== 5. تطبيق التنقيح والتصنيف وإصلاح التنسيق الداخلي لجميع الكتب وبناء فهرس البحث والتأويل ==================
          search_index = []
          tafsir_db = {"ar": {}, "fr": {}, "en": {}}

          # قائمة أسماء السور لمطابقة فصول التأويل تلقائياً
          SURAH_NAMES_AR = [
              "الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس",
              "هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه",
              "الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
              "لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر",
              "فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق",
              "الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة",
              "الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج",
              "نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس",
              "التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد",
              "الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات",
              "القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر",
              "المسد","الإخلاص","الفلق","الناس"
          ]

          for b in books_list:
              bnum = int(b["num"])
              if bnum in CURATED_MAP:
                  c_lang, c_cat, c_title, c_order = CURATED_MAP[bnum]
                  b["lang"] = c_lang
                  b["category"] = c_cat
                  b["title"] = c_title
                  b["sort_order"] = c_order
              else:
                  b["title"] = clean_book_name_str(b.get("title", f"كتاب {bnum}"))
                  b["sort_order"] = b.get("sort_order", 50)

              # مطابقة وتحميل صورة الغلاف من السيرفر الرسمي
              local_cover = f"data/covers/{bnum}.jpg"
              if not os.path.exists(local_cover) and api_books:
                  nt = norm_match(b["title"])
                  best_img = None
                  for ab in api_books:
                      aname = norm_match(ab.get("name", ""))
                      if aname and (aname in nt or nt in aname or aname.split()[:3] == nt.split()[:3]):
                          best_img = ab.get("image_url")
                          if best_img and best_img != "0":
                              break
                  if best_img and best_img != "0":
                      try:
                          img_r = requests.get(best_img, timeout=12, verify=False)
                          if img_r.status_code == 200 and len(img_r.content) > 1000:
                              with open(local_cover, "wb") as imgf:
                                  imgf.write(img_r.content)
                      except Exception:
                          pass
              if os.path.exists(local_cover):
                  b["cover"] = local_cover

              # فتح ملف الكتاب لإصلاح تنسيقه الداخلي وبناء كشاف البحث والتأويل
              bfile = f"data/user_books/{bnum}.json"
              if os.path.exists(bfile):
                  try:
                      with open(bfile, "r", encoding="utf-8") as bf:
                          bdata = json.load(bf)
                      bdata["title"] = b["title"]
                      bdata["lang"] = b["lang"]
                      bdata["category"] = b["category"]
                      is_qa = (bnum == 3)

                      new_chapters = []
                      for ch in bdata.get("chapters", []):
                          ch_title = clean_book_name_str(ch.get("title", ""))
                          fixed_html, plain_txt = clean_and_format_chapter_html(ch.get("html", ""), ch_title, is_qa)
                          ch["title"] = ch_title
                          ch["html"] = fixed_html
                          new_chapters.append(ch)

                          # إضافة فقرات الفصل إلى محرك البحث الشامل (مثل Google)
                          for para in plain_txt.split("."):
                              p_clean = para.strip()
                              if len(p_clean) > 25:
                                  search_index.append({
                                      "b": bnum,
                                      "c": ch["idx"] - 1,
                                      "l": b["lang"],
                                      "t": p_clean[:260]
                                  })

                          # ربط كتب التأويل بزر التأويل في المصحف حسب اللغة
                          if bnum in [28, 29, 30, 31, 32, 33, 34]:
                              for s_idx, s_name in enumerate(SURAH_NAMES_AR, 1):
                                  if f"سورة {s_name}" in ch_title or f"سورة {s_name}" in plain_txt[:200]:
                                      prev = tafsir_db["ar"].get(str(s_idx), "")
                                      if len(prev) < 6000:
                                          tafsir_db["ar"][str(s_idx)] = (prev + f"\n\n<h4>من {b['title']} ({ch_title}):</h4>\n" + fixed_html)[:10000]
                              if bnum == 28 and "2" not in tafsir_db["ar"]:
                                  tafsir_db["ar"]["2"] = fixed_html[:8000]

                      # ربط التأويل الفرنسي بالسور المحددة
                      fr_surah_map = {73: [2], 61: [3], 80: [4], 78: [12], 77: [18], 79: [36], 74: list(range(67, 78)), 69: list(range(78, 115))}
                      if bnum in fr_surah_map and new_chapters:
                          combined_fr = "\n".join(f"<h4>{c['title']}</h4>\n{c['html']}" for c in new_chapters[:8])[:12000]
                          for s_id in fr_surah_map[bnum]:
                              tafsir_db["fr"][str(s_id)] = {"book_num": bnum, "book_title": b["title"], "html": combined_fr}

                      # ربط التأويل الإنجليزي بالجزء 29 والجزء 30
                      en_surah_map = {55: list(range(67, 78)), 54: list(range(78, 115))}
                      if bnum in en_surah_map and new_chapters:
                          combined_en = "\n".join(f"<h4>{c['title']}</h4>\n{c['html']}" for c in new_chapters[:8])[:12000]
                          for s_id in en_surah_map[bnum]:
                              tafsir_db["en"][str(s_id)] = {"book_num": bnum, "book_title": b["title"], "html": combined_en}

                      bdata["chapters"] = new_chapters
                      b["chapters_count"] = len(new_chapters)
                      with open(bfile, "w", encoding="utf-8") as bf:
                          json.dump(bdata, bf, ensure_ascii=False)
                  except Exception:
                      pass

          catalog_state["scanned_msg_ids"] = sorted(list(scanned_set))[-1000:]
          catalog_state["books"] = sorted(books_list, key=lambda x: (x.get("sort_order", 50), x["num"]))

          with open(catalog_path, "w", encoding="utf-8") as f:
              json.dump(catalog_state, f, ensure_ascii=False, indent=2)

          with open("data/books_search_index.json", "w", encoding="utf-8") as f:
              json.dump(search_index[:15000], f, ensure_ascii=False)

          with open("data/tawil_multilang.json", "w", encoding="utf-8") as f:
              json.dump(tafsir_db, f, ensure_ascii=False)

          if new_books_report:
              send_tg("✅ تم استلام وترقيم الملفات الجديدة التي أرسلتها:\n\n" + "\n".join(new_books_report) + "\n\nأرسل لي أرقامها لنضعها في أقسامها الصحيحة!")
          else:
              send_tg("✅ تم تنسيق جميع الكتب الـ 80، وإصلاح الأقواس المقطعة، وتلوين كتاب سؤال وجواب، وسحب الأغلفة، وبناء محرك البحث الشامل بنجاح!")
          EOF

      - name: Commit Curated Books, Covers & Search Index
        run: |
          git config user.name "RohAlquranBot"
          git config user.email "bot@rohalquran.app"
          git add data/
          git diff --staged --quiet || (git commit -m "Curate 80 books, fix formatting, fetch covers, build search & tafsir index" && git pull --rebase origin main && git push)
