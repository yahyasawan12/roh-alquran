name: Deep Clean All 93 Books (Deduplicate & Strip Garbled Glyphs) + Bot CMS

on:
  push:
    paths:
      - '.github/workflows/setup.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  deep-clean-and-cms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python Libraries
        run: pip install requests beautifulsoup4 lxml pymupdf urllib3

      - name: Deduplicate Paragraphs, Strip QCF Garbled Chars & Run Bot CMS
        env:
          BOT_TOKEN: ${{ secrets.BO_TOKEN }}
          SUPER_ADMIN_ID: "5205216077"
        run: |
          python3 - << 'EOF'
          import os, re, io, json, glob, urllib3
          import requests
          from bs4 import BeautifulSoup
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          SUPER_ADMIN_ID = str(os.environ.get("SUPER_ADMIN_ID", "5205216077")).strip()

          def strip_garbled(text):
              if not text: return ""
              # إزالة الحروف الفارسية والأوردية الناتجة عن خطوط PDF المشفرة
              text = re.sub(r'[^\s]*[پچژگکڑٹڈے]+[^\s]*', ' ', text)
              text = re.sub(r'(?:\b[أآبپتثجچحخدذرزژسشصضطظعغفقكکگلمنهوي]\s+){3,}', ' ', text)
              text = re.sub(r'\(\s*:\s*[^)]*\)', ' ', text)
              return re.sub(r'\s{2,}', ' ', text).strip()

          def norm_ar(s):
              s = re.sub(r'[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]', '', str(s))
              s = re.sub(r'[أإآٱ]', 'ا', s)
              s = re.sub(r'ة', 'ه', s)
              return re.sub(r'\s+', ' ', s).strip().lower()

          # تطهير جميع ملفات الكتب المحفوظة في data/user_books/*.json من التكرار والرموز الغريبة
          search_index = []
          for bfile in sorted(glob.glob("data/user_books/*.json")):
              try:
                  with open(bfile, "r", encoding="utf-8") as f:
                      bdata = json.load(f)
                  bnum = int(bdata.get("num", 0))
                  blang = bdata.get("lang", "ar")
                  new_chaps = []

                  for idx, ch in enumerate(bdata.get("chapters", []), 1):
                      ctitle = strip_garbled(ch.get("title", ""))
                      if blang != "ar":
                          ctitle = re.sub(r'^(القسم|الفصل)\s*(\d+)', r'Section \2', ctitle)
                      sp = BeautifulSoup(ch.get("html", ""), "lxml")
                      leaf_tags = sp.find_all(["p", "h1", "h2", "h3", "h4", "li"])
                      if not leaf_tags:
                          raw_lines = [strip_garbled(ln) for ln in sp.get_text("\n").split("\n") if strip_garbled(ln)]
                      else:
                          raw_lines = [strip_garbled(t.get_text(" ", strip=True)) for t in leaf_tags if strip_garbled(t.get_text(" ", strip=True))]

                      deduped = []
                      seen_norms = set()
                      for ln in raw_lines:
                          nl = norm_ar(ln)
                          if len(nl) < 2: continue
                          if nl in seen_norms and len(nl) > 12:
                              continue
                          seen_norms.add(nl)
                          deduped.append(ln)
                          if len(ln) > 25:
                              search_index.append({"b": bnum, "c": idx - 1, "l": blang, "t": ln[:240]})

                      if deduped:
                          ch["title"] = ctitle or (f"Section {idx}" if blang != "ar" else f"المبحث {idx}")
                          ch["html"] = "\n".join(f"<p>{p}</p>" for p in deduped)
                          new_chaps.append(ch)

                  bdata["chapters"] = new_chaps
                  with open(bfile, "w", encoding="utf-8") as f:
                      json.dump(bdata, f, ensure_ascii=False)
              except Exception:
                  pass

          with open("data/books_search_index.json", "w", encoding="utf-8") as f:
              json.dump(search_index[:22000], f, ensure_ascii=False)
          EOF

      - name: Commit Cleaned Books & Search Index
        run: |
          git config user.name "RohAlquranBot"
          git config user.email "bot@rohalquran.app"
          git add data/
          git diff --staged --quiet || (git commit -m "Deduplicate book paragraphs, strip garbled QCF glyphs, rebuild search index" && git pull --rebase origin main && git push)
