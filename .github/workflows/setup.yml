name: Cloud APK & Full Books Extractor

on:
  push:
    paths:
      - '.github/workflows/setup.yml'
  workflow_dispatch:

jobs:
  extract-app-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: pip install requests beautifulsoup4 lxml cloudscraper

      - name: Download & Inspect Original APK + Website Books
        env:
          BOT_TOKEN: ${{ secrets.BO_TOKEN }}
          ADMIN_ID: "5205216077"
        run: |
          cat << 'EOF' > cloud_extractor.py
          import os, re, json, zipfile
          import requests, cloudscraper
          from bs4 import BeautifulSoup

          TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          ADMIN_ID = os.environ.get("ADMIN_ID", "").strip()
          PKG = "com.aminsheikho.alaminlibrary"
          scraper = cloudscraper.create_scraper()

          def tg_msg(text):
              requests.post(
                  f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                  json={"chat_id": ADMIN_ID, "text": text, "parse_mode": "Markdown"},
                  timeout=15
              )

          def tg_doc(path, caption):
              with open(path, "rb") as f:
                  requests.post(
                      f"https://api.telegram.org/bot{TOKEN}/sendDocument",
                      data={"chat_id": ADMIN_ID, "caption": caption},
                      files={"document": f},
                      timeout=30
                  )

          tg_msg("🚀 *بدأ السيرفر السحابي بفحص وسحب حزمة تطبيق (مكتبة الأمين) وسلة الكتب...*")

          report = {
              "apk_found": False,
              "apk_source": "",
              "apk_files": [],
              "discovered_apis_and_urls": [],
              "book_page_structure": {},
              "cart_test": {}
          }

          # 1. البحث عن ملف APK الأصلي عبر واجهة Aptoide و APKPure السحابية
          apk_path = "alamin.apk"
          try:
              apt_url = f"https://ws75.aptoide.com/api/7/app/get/package_name={PKG}"
              r = requests.get(apt_url, timeout=15)
              if r.status_code == 200:
                  data = r.json()
                  dl_url = (((data.get("nodes") or {}).get("meta") or {}).get("data") or {}).get("file", {}).get("path")
                  if dl_url:
                      report["apk_source"] = dl_url
                      apk_ bin = requests.get(dl_url, timeout=60).content
                      with open(apk_path, "wb") as f:
                          f.write(apk_bin)
                      report["apk_found"] = True
          except Exception as e:
              report["aptoide_note"] = str(e)

          if not report["apk_found"]:
              for mirror in [
                  f"https://d.apkpure.com/b/APK/{PKG}?version=latest",
                  f"https://d.apkpure.net/b/APK/{PKG}?version=latest"
              ]:
                  try:
                      r = scraper.get(mirror, timeout=30, allow_redirects=True)
                      if r.status_code == 200 and len(r.content) > 1000000:
                          with open(apk_path, "wb") as f:
                              f.write(r.content)
                          report["apk_found"] = True
                          report["apk_source"] = mirror
                          break
                  except Exception:
                      pass

          # 2. إذا نزل الـ APK في السحابة، نفك ضغطه ونستخرج قواعد البيانات وروابط السيرفر الخلفي
          if report["apk_found"] and zipfile.is_zipfile(apk_path):
              urls_found = set()
              with zipfile.ZipFile(apk_path, "r") as z:
                  for name in z.namelist():
                      if any(k in name.lower() for k in ["assets/", "res/raw/", ".db", ".sqlite", ".json", ".epub", "bundle", "libapp.so", "classes.dex"]):
                          report["apk_files"].append(name)
                      if name.endswith((".dex", ".so", ".bundle", ".json", ".js", ".xml")) and z.getinfo(name).file_size < 25000000:
                          try:
                              raw_bytes = z.read(name)
                              for m in re.findall(rb'https?://[a-zA-Z0-9._/-]{8,120}', raw_bytes):
                                  u = m.decode("utf-8", errors="ignore")
                                  if not any(ig in u for ig in ["schemas.android", "w3.org", "google.com/apk", "apache.org", "facebook.com", "github.com"]):
                                      urls_found.add(u)
                          except Exception:
                              pass
              report["discovered_apis_and_urls"] = sorted(list(urls_found))[:150]

          # 3. فحص صفحة كتاب إلكتروني وصوتي في الموقع لكشف محتوى (الصيغ الإلكترونية المتوفرة)
          try:
              prod_res = scraper.get("https://www.amin-sheikho.com/wp-json/wp/v2/product?per_page=20", timeout=20).json()
              for p in prod_res[:5]:
                  link = p.get("link", "")
                  if link:
                      html = scraper.get(link, timeout=15).text
                      soup = BeautifulSoup(html, "lxml")
                      accordions = [el.get_text(" | ", strip=True) for el in soup.find_all(["div", "section", "ul"]) if "الصيغ" in el.get_text() or "فهرس" in el.get_text()]
                      all_links = [a.get("href") for a in soup.find_all("a", href=True) if any(x in a.get("href", "") for x in ["cart", "download", "file", "pdf", "epub", "mp3", "play.google", "apple"])]
                      report["book_page_structure"][p.get("title", {}).get("rendered", "")] = {
                          "url": link,
                          "links_in_page": all_links[:20],
                          "accordions_preview": [a[:300] for a in accordions[:3]]
                      }
          except Exception as e:
              report["book_page_error"] = str(e)

          os.makedirs("data", exist_ok=True)
          with open("data/cloud_extract_report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)

          summary = (
              "✅ *اكتمل الفحص السحابي لحزمة التطبيق والموقع!*\n\n"
              f"📦 *سحب الـ APK في السحابة:* {'نجح ✔️' if report['apk_found'] else 'يتطلب استخراج ملف القاعدة من الجهاز'}\n"
              f"📂 *عدد الملفات المهمة داخل الحزمة:* {len(report['apk_files'])}\n"
              f"🌐 *روابط السيرفرات المكتشفة:* {len(report['discovered_apis_and_urls'])}\n\n"
              "📎 مرفق ملف التقرير (`cloud_extract_report.json`)، افتحه وأرسله لي لنبدأ فوراً بربط التأويل آية بآية!"
          )
          tg_msg(summary)
          tg_doc("data/cloud_extract_report.json", "تقرير تفكيك الحزمة والسيرفرات")
          EOF
          python3 cloud_extractor.py
