name: Telegram Bot Quiz & Content Manager

on:
  push:
    paths:
      - '.github/workflows/setup.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  bot-cms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install requests
        run: pip install requests

      - name: Process Admin Commands for Quizzes
        env:
          BOT_TOKEN: ${{ secrets.BO_TOKEN }}
          ADMIN_ID: "5205216077"
        run: |
          python3 - << 'EOF'
          import os, json, requests

          TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          ADMIN_ID = str(os.environ.get("ADMIN_ID", "5205216077")).strip()
          os.makedirs("data", exist_ok=True)
          quiz_file = "data/quizzes.json"

          default_quizzes = [
              {
                  "q": "ما هي الآية الكريمة التي تبيّن أن منهاج الدعوة إلى الله يقوم على البصيرة؟",
                  "options": [
                      "﴿قُلْ هَٰذِهِ سَبِيلِي أَدْعُو إِلَى اللَّهِ عَلَىٰ بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي﴾ [يوسف: 108]",
                      "﴿ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ﴾ [النحل: 125]",
                      "﴿وَمَنْ أَحْسَنُ قَوْلًا مِّمَّن دَعَا إِلَى اللَّهِ﴾ [فصلت: 33]"
                  ],
                  "correct": 0,
                  "explain": "تتصدر آية سورة يوسف (108) منهج «دعوتنا إلى الله» في تعريف الناس بكمال الله ورحمته وعدله عن بصيرةٍ وتحقيق."
              },
              {
                  "q": "كم عدد مجلدات سلسلة «تأويل القرآن العظيم» للعلامة محمد أمين شيخو؟",
                  "options": ["5 مجلدات", "9 مجلدات (تغطي القرآن الكريم وجزء عمّ)", "3 مجلدات"],
                  "correct": 1,
                  "explain": "تضم السلسلة مجلدات تأويل القرآن العظيم بالإضافة إلى تأويل جزء عمّ وأسرار السبع المثاني."
              }
          ]

          if os.path.exists(quiz_file):
              with open(quiz_file, "r", encoding="utf-8") as f:
                  quizzes = json.load(f)
          else:
              quizzes = default_quizzes

          def send_msg(chat_id, text):
              requests.post(
                  f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                  json={"chat_id": chat_id, "text": text},
                  timeout=15
              )

          up = requests.get(f"https://api.telegram.org/bot{TOKEN}/getUpdates?limit=50", timeout=20).json()
          last_update_id = None
          changed = False

          for item in up.get("result", []):
              last_update_id = item["update_id"]
              msg = item.get("message") or {}
              sender_id = str((msg.get("from") or {}).get("id", ""))
              text = (msg.get("text") or "").strip()

              if sender_id != ADMIN_ID or not text:
                  continue

              if text.startswith("/list_quizzes"):
                  lines = ["📋 قائمة الاختبارات الحالية في التطبيق:\n"]
                  for i, qz in enumerate(quizzes, 1):
                      lines.append(f"{i}) {qz['q']}")
                  lines.append("\n💡 لحذف سؤال أرسل: /del_quiz رقم_السؤال")
                  send_msg(ADMIN_ID, "\n".join(lines))

              elif text.startswith("/add_quiz"):
                  raw = text.replace("/add_quiz", "", 1).strip()
                  parts = [p.strip() for p in raw.split("|")]
                  if len(parts) >= 6:
                      q_text = parts[0]
                      opts = [parts[1], parts[2], parts[3]]
                      corr = max(0, min(2, int(parts[4]) - 1)) if parts[4].isdigit() else 0
                      exp = parts[5]
                      quizzes.append({"q": q_text, "options": opts, "correct": corr, "explain": exp})
                      changed = True
                      send_msg(ADMIN_ID, f"✅ تم إضافة الاختبار بنجاح! (إجمالي الأسئلة الآن: {len(quizzes)})")
                  else:
                      send_msg(ADMIN_ID, "⚠️ صيغة الإضافة:\n/add_quiz السؤال | خيار1 | خيار2 | خيار3 | رقم_الصحيح(1-3) | الشرح")

              elif text.startswith("/del_quiz"):
                  num_str = text.replace("/del_quiz", "", 1).strip()
                  if num_str.isdigit():
                      idx = int(num_str) - 1
                      if 0 <= idx < len(quizzes):
                          removed = quizzes.pop(idx)
                          changed = True
                          send_msg(ADMIN_ID, f"🗑️ تم حذف السؤال: ({removed['q']}) بنجاح!")
                      else:
                          send_msg(ADMIN_ID, "⚠️ رقم السؤال غير موجود.")

          if last_update_id is not None:
              requests.get(f"https://api.telegram.org/bot{TOKEN}/getUpdates?offset={last_update_id + 1}", timeout=10)

          with open(quiz_file, "w", encoding="utf-8") as f:
              json.dump(quizzes, f, ensure_ascii=False, indent=2)
          EOF

      - name: Commit Updated Quizzes
        run: |
          git config user.name "RohAlquranBot"
          git config user.email "bot@rohalquran.app"
          git add data/quizzes.json
          git diff --staged --quiet || git commit -m "Update quizzes via Telegram Bot CMS"
          git push
