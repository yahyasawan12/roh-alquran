name: Curate 93 Books, Extract Merged Tafsir & Build Search Index

on:
  push:
    paths:
      - '.github/workflows/setup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python Libraries
        run: pip install requests beautifulsoup4 lxml pymupdf urllib3

      - name: Process New Books (81-93), Extract Merged Tafsir & Build Full Index
        env:
          BOT_TOKEN: ${{ secrets.BO_TOKEN }}
          ADMIN_ID: "5205216077"
        run: |
          python3 - << 'EOF'
