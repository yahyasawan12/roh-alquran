name: Pro AI & Vector Logo Studio

on:
  push:
    paths:
      - '.github/workflows/setup.yml'
  workflow_dispatch:

jobs:
  design-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pro Graphics Libraries
        run: pip install requests pillow numpy cairosvg opencv-python-headless

      - name: Render High-Precision Logos
        env:
          BOT_TOKEN: ${{ secrets.BO_TOKEN }}
          ADMIN_ID: "5205216077"
          CHANNEL_ID: "-1004482762316"
        run: |
          cat << 'EOF' > studio.py
          import os, io
          import requests
          import numpy as np
          import cv2
          from PIL import Image
          import cairosvg

          TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          ADMIN_ID = os.environ.get("ADMIN_ID", "").strip()
          CHANNEL_ID = os.environ.get("CHANNEL_ID", "").strip()
          os.makedirs("assets", exist_ok=True)

          def send_photo(path, caption):
              with open(path, "rb") as f:
                  requests.post(
                      f"https://api.telegram.org/bot{TOKEN}/sendPhoto",
                      data={"chat_id": ADMIN_ID, "caption": caption, "parse_mode": "Markdown"},
                      files={"photo": f},
                      timeout=30
                  )

          # 1. جلب الصورة الأصلية المرسلة للبوت بدقتها الكاملة
          orig_bytes = None
          try:
              up = requests.get(f"https://api.telegram.org/bot{TOKEN}/getUpdates", timeout=15).json()
              for item in reversed(up.get("result", [])):
                  msg = item.get("message") or {}
                  photos = msg.get("photo")
                  if photos:
                      fid = photos[-1]["file_id"]
                      finfo = requests.get(f"https://api.telegram.org/bot{TOKEN}/getFile?file_id={fid}", timeout=15).json()
                      fpath = finfo["result"]["file_path"]
                      orig_bytes = requests.get(f"https://api.telegram.org/file/bot{TOKEN}/{fpath}", timeout=20).content
                      with open("assets/raw_input.jpg", "wb") as f:
                          f.write(orig_bytes)
                      break
          except Exception as e:
              print("Update fetch note:", e)

          if orig_bytes:
              # تكبير الصورة الأصلية 4 أضعاف (Super-Resolution 1600x1600) للحصول على حواف فيكتور ناعمة جداً
              pil_img = Image.open(io.BytesIO(orig_bytes)).convert("RGB")
              S = 1600
              pil_img = pil_img.resize((S, S), Image.Resampling.LANCZOS)
              arr = np.array(pil_img)

              # أ. قياس مكان السطر وسماكة الخط واللون البني بدقة البكسل من كلمة (القر)
              # منطقة الوصلة الأفقية بين اللام والقاف: x = 0.78..0.81, y = 0.55..0.68
              strip = arr[int(S*0.55):int(S*0.685), int(S*0.785):int(S*0.805)]
              gray_strip = np.mean(strip, axis=(1, 2))
              brown_rows = np.where(gray_strip < 130)[0]
              if len(brown_rows) > 5:
                  y_base_top = int(S*0.55) + int(brown_rows[0])
                  y_base_bot = int(S*0.55) + int(brown_rows[-1])
              else:
                  y_base_top = int(S*0.618)
                  y_base_bot = int(S*0.662)

              sw = max(y_base_bot - y_base_top, int(S * 0.042))
              y_center = (y_base_top + y_base_bot) / 2.0

              # قياس ارتفاع وحجم نقطتي حرف القاف لمطابقة نقطة النون معها 100%
              q_dots_zone = arr[int(S*0.43):int(S*0.52), int(S*0.65):int(S*0.77)]
              q_gray = np.mean(q_dots_zone, axis=2)
              q_y_idx, q_x_idx = np.where(q_gray < 120)
              if len(q_y_idx) > 10:
                  y_dot_center = int(S*0.43) + int(np.median(q_y_idx))
                  dot_r = int((np.max(q_y_idx) - np.min(q_y_idx)) / 2.0)
              else:
                  y_dot_center = int(S*0.482)
                  dot_r = int(sw * 0.56)

              # قياس الحد الأيسر لجذع الشجرة بدقة لمنع لمسه
              trunk_zone = arr[int(S*0.50):int(S*0.62), int(S*0.40):int(S*0.46)]
              trunk_x_idx = np.where(np.mean(trunk_zone, axis=(0, 2)) < 130)[0]
              trunk_left_x = int(S*0.40) + int(trunk_x_idx[0]) if len(trunk_x_idx) > 0 else int(S*0.422)

              # ب. مسح جراحي ذكي لمنطقة (ءة) بالكامل (يستهدف اللون البني فقط ويحمي الأزرق والأخضر والجذع)
              roi = arr[int(S*0.42):int(S*0.688), int(S*0.04):trunk_left_x - 4]
              r_ch, g_ch, b_ch = roi[:, :, 0].astype(int), roi[:, :, 1].astype(int), roi[:, :, 2].astype(int)
              # البني/الرمادي الداكن ليس أزرق (b - r < 35) وليس أخضر (g - r < 35)
              is_brown_or_shadow = (r_ch < 245) & ((b_ch - r_ch) < 35) & ((g_ch - r_ch) < 35)
              roi[is_brown_or_shadow] = [255, 255, 255]
              arr[int(S*0.42):int(S*0.688), int(S*0.04):trunk_left_x - 4] = roi

              clean_base = Image.fromarray(arr).convert("RGBA")

              # ج. تصميم حرف (ن) هندسي مطابق تماماً لخط (القراءة) عبر فيكتور SVG فائق النعومة
              x_right = trunk_left_x - int(sw * 1.35)
              x_left = int(S * 0.155)
              y_top = int(y_base_bot - sw * 2.55)
              r_corner = int(sw * 1.15)
              x_dot = (x_right + x_left) / 2.0

              def render_overlay(with_maddah=False):
                  maddah_svg = ""
                  if with_maddah:
                      # مدّة قرآنية أنيقة متناسقة فوق الألف/النون
                      mx1 = x_right - int(sw * 0.2)
                      mx2 = trunk_left_x + int(sw * 1.1)
                      my = int(S * 0.455)
                      m_sw = int(sw * 0.55)
                      maddah_svg = f'<path d="M {mx2} {my} C {mx2 - sw*0.4} {my - sw*0.45}, {mx1 + sw*0.4} {my + sw*0.45}, {mx1} {my}" fill="none" stroke="#3B271E" stroke-width="{m_sw}" stroke-linecap="round"/>'

                  svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {S} {S}" width="{S}" height="{S}">
                    <path d="M {x_right} {y_top}
                             L {x_right} {y_center - r_corner}
                             Q {x_right} {y_center} {x_right - r_corner} {y_center}
                             L {x_left + r_corner} {y_center}
                             Q {x_left} {y_center} {x_left} {y_center - r_corner}
                             L {x_left} {y_top}"
                          fill="none" stroke="#3B271E" stroke-width="{sw}" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="{x_dot}" cy="{y_dot_center}" r="{dot_r}" fill="#3B271E"/>
                    {maddah_svg}
                  </svg>'''
                  png_bytes = cairosvg.svg2png(bytestring=svg.encode("utf-8"), output_width=S, output_height=S)
                  overlay = Image.open(io.BytesIO(png_bytes)).convert("RGBA")
                  combined = Image.alpha_composite(clean_base, overlay).convert("RGB")
                  return combined

              v1 = render_overlay(with_maddah=False)
              v1.save("assets/logo_v1_clean.png", "PNG", quality=100)
              v1.save("assets/logo.png", "PNG", quality=100)

              v2 = render_overlay(with_maddah=True)
              v2.save("assets/logo_v2_maddah.png", "PNG", quality=100)

              send_photo("assets/logo_v1_clean.png", "✨ *النسخة 1 (مطابقة 100% لخط وسطر الصورة الأصلية بدون أي زوائد)*")
              send_photo("assets/logo_v2_maddah.png", "✨ *النسخة 2 (بنفس الخط الأصلي مع إضافة علامة المدّة لـ القرآن)*")

              # تحديث صورة القناة الخاصة بالنسخة النقية الأولى تلقائياً
              with open("assets/logo_v1_clean.png", "rb") as f:
                  requests.post(
                      f"https://api.telegram.org/bot{TOKEN}/setChatPhoto",
                      data={"chat_id": CHANNEL_ID},
                      files={"photo": f},
                      timeout=30
                  )

          # 2. توليد نسخة ثالثة فنية بالذكاء الاصطناعي (Flux AI) للمقارنة
          try:
              prompt = "Minimalist flat vector islamic logo on pure white background, green sprouting tree growing from arabic calligraphy Al-Quran Hayat in dark brown and sky blue, clean geometric typography, professional app icon, 4k"
              ai_url = f"https://image.pollinations.ai/prompt/{requests.utils.quote(prompt)}?width=1024&height=1024&nologo=true&model=flux"
              r_ai = requests.get(ai_url, timeout=35)
              if r_ai.status_code == 200 and len(r_ai.content) > 5000:
                  with open("assets/logo_v3_ai.png", "wb") as f:
                      f.write(r_ai.content)
                  send_photo("assets/logo_v3_ai.png", "🤖 *النسخة 3 (تصميم فني مقترح مولّد بالذكاء الاصطناعي)*")
          except Exception as e:
              print("AI gen note:", e)
          EOF
          python3 studio.py

      - name: Save Pro Logos
        run: |
          git config user.name "RohAlquranBot"
          git config user.email "bot@rohalquran.app"
          git add assets/
          git diff --staged --quiet || git commit -m "Update ultra-clean vector and AI logos"
          git push
