name: Instant Book & Audio Auto-Sorter and Audit

on:
  push:
    paths:
      - '.github/workflows/setup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sort-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python Libraries
        run: pip install requests beautifulsoup4 lxml urllib3

      - name: Process Sent Books, Auto-Fetch Audios & Send Audit Report
        env:
          BOT_TOKEN: ${{ secrets.BO_TOKEN }}
          ADMIN_ID: "5205216077"
        run: |
          python3 - << 'EOF'
          import os, re, io, json, hashlib, zipfile, urllib3
          import xml.etree.ElementTree as ET
          import requests
          from bs4 import BeautifulSoup
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          ADMIN_ID = str(os.environ.get("ADMIN_ID", "5205216077")).strip()

          def send_tg(text):
              for i in range(0, len(text), 3800):
                  try:
                      requests.post(
                          f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                          json={"chat_id": ADMIN_ID, "text": text[i:i+3800]},
                          timeout=20
                      )
                  except Exception:
                      pass

          send_tg("⏳ بدأ السيرفر الآن بفرز الكتب التي أرسلتها وفحص محتواها الداخلي وإعداد تقرير الجرد...")

          os.makedirs("data/books_content", exist_ok=True)
          os.makedirs("data/files/books", exist_ok=True)
          os.makedirs("data/files/audio", exist_ok=True)

          with open("data/api_v1_books.json", "r", encoding="utf-8") as f:
              all_items = json.load(f).get("data", [])

          with open("data/api_v1_categories.json", "r", encoding="utf-8") as f:
              all_cats = json.load(f).get("data", [])

          reg_path = "data/media_registry.json"
          if os.path.exists(reg_path):
              with open(reg_path, "r", encoding="utf-8") as f:
                  registry = json.load(f)
          else:
              registry = {
                  "last_update_id": 0,
                  "active_cat_id": None,
                  "file_hashes": {},
                  "tg_unique_ids": {},
                  "books_done": {},
                  "audios_done": {}
              }

          def norm_text(s):
              if not s: return ""
              s = re.sub(r'[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]', '', str(s))
              s = re.sub(r'[أإآٱ]', 'ا', s)
              s = re.sub(r'ة', 'ه', s)
              s = re.sub(r'ى', 'ي', s)
              s = re.sub(r'\(\d+\)', '', s) # إزالة (1) و (2) التي يضيفها الجوال عند تكرار الاسم
              s = re.sub(r'\.(pdf|epub|mp3|m4a|wav|ogg|zip)$', '', s, flags=re.I)
              s = re.sub(r'[^\w\s]', ' ', s)
              return re.sub(r'\s+', ' ', s).strip().lower()

          # استخراج نص الـ EPUB + قراءة العنوان الحقيقي من داخل الكتاب نفسه
          def parse_epub_bytes(epub_bytes):
              chapters_html = []
              internal_title = ""
              try:
                  with zipfile.ZipFile(io.BytesIO(epub_bytes), 'r') as z:
                      opf_path = None
                      if 'META-INF/container.xml' in z.namelist():
                          root = ET.fromstring(z.read('META-INF/container.xml'))
                          for elem in root.iter():
                              if elem.tag.endswith('rootfile') and 'full-path' in elem.attrib:
                                  opf_path = elem.attrib['full-path']
                                  break
                      if not opf_path:
                          for name in z.namelist():
                              if name.endswith('.opf'):
                                  opf_path = name
                                  break

                      html_files = []
                      if opf_path and opf_path in z.namelist():
                          opf_dir = os.path.dirname(opf_path)
                          opf_root = ET.fromstring(z.read(opf_path))
                          manifest = {}
                          spine_ids = []
                          for elem in opf_root.iter():
                              if elem.tag.endswith('title') and elem.text and not internal_title:
                                  internal_title = elem.text.strip()
                              elif elem.tag.endswith('item') and 'id' in elem.attrib and 'href' in elem.attrib:
                                  manifest[elem.attrib['id']] = elem.attrib['href']
                              elif elem.tag.endswith('itemref') and 'idref' in elem.attrib:
                                  spine_ids.append(elem.attrib['idref'])
                          for sid in spine_ids:
                              href = manifest.get(sid)
                              if href:
                                  full_h = os.path.normpath(os.path.join(opf_dir, href)).replace('\\', '/')
                                  if full_h in z.namelist():
                                      html_files.append(full_h)

                      if not html_files:
                          html_files = sorted([n for n in z.namelist() if n.lower().endswith(('.xhtml', '.html', '.htm'))])

                      for hf in html_files:
                          raw_html = z.read(hf).decode('utf-8', errors='ignore')
                          soup = BeautifulSoup(raw_html, 'lxml')
                          if not internal_title and soup.title and soup.title.string:
                              internal_title = soup.title.string.strip()
                          for tag in soup(['script', 'style', 'head', 'nav']):
                              tag.decompose()
                          body = soup.body or soup
                          txt = body.get_text(separator='\n', strip=True)
                          if len(txt) > 15:
                              clean_p = "".join(f"<p>{line.strip()}</p>" for line in txt.split('\n') if line.strip())
                              chapters_html.append(clean_p)
              except Exception:
                  pass
              full_html = "\n<hr>\n".join(chapters_html) if chapters_html else None
              return full_html, internal_title

          def find_best_book_match(file_name, caption, internal_title=""):
              text_candidates = [it for it in all_items if not it.get("is_audio")]

              # 1. إذا وُجد رقم الكتاب صراحة في الوصف أو الاسم
              for src in [caption, file_name]:
                  m = re.search(r'#(\d{2,4})\b', src or "")
                  if m:
                      cid = int(m.group(1))
                      for it in text_candidates:
                          if int(it["id"]) == cid:
                              return it

              # 2. مطابقة عبر العنوان الداخلي للـ EPUB أو اسم الملف أو الوصف
              for candidate_label in [internal_title, caption, file_name]:
                  nl = norm_text(candidate_label)
                  if not nl or len(nl) < 3:
                      continue
                  best = None
                  best_len = 0
                  for it in text_candidates:
                      bname = norm_text(it.get("name") or "")
                      if not bname:
                          continue
                      if bname == nl:
                          return it
                      if bname in nl or nl in bname:
                          if len(bname) > best_len:
                              best_len = len(bname)
                              best = it
                  if best:
                      return best
              return None

          # سحب كل الرسائل المتراكمة من البوت والقناة على دفعات (حتى لو كانت أكثر من 100 رسالة)
          newly_added_books = []
          duplicates_skipped = []
          unmatched_files = []

          while True:
              offset = registry.get("last_update_id", 0) + 1
              up_res = requests.get(f"https://api.telegram.org/bot{TOKEN}/getUpdates?offset={offset}&limit=100", timeout=25).json()
              updates = up_res.get("result", [])
              if not updates:
                  break

              for u in updates:
                  registry["last_update_id"] = u["update_id"]
                  msg = u.get("message") or u.get("channel_post") or {}
                  caption = (msg.get("caption") or "").strip()
                  doc = msg.get("document")
                  if not doc:
                      continue

                  f_id = doc.get("file_id")
                  f_uniq = doc.get("file_unique_id")
                  f_name = doc.get("file_name") or "book"
                  f_size = doc.get("file_size", 0)

                  if f_uniq in registry["tg_unique_ids"]:
                      duplicates_skipped.append(f_name)
                      continue

                  if not any(f_name.lower().endswith(ext) for ext in [".epub", ".pdf"]):
                      continue

                  if f_size < 19900000:
                      f_info = requests.get(f"https://api.telegram.org/bot{TOKEN}/getFile?file_id={f_id}", timeout=20).json()
                      f_path_tg = (f_info.get("result") or {}).get("file_path")
                      if not f_path_tg:
                          continue
                      raw_bytes = requests.get(f"https://api.telegram.org/file/bot{TOKEN}/{f_path_tg}", timeout=45).content
                      sha256_hash = hashlib.sha256(raw_bytes).hexdigest()

                      if sha256_hash in registry["file_hashes"]:
                          duplicates_skipped.append(f"{f_name} (مكرر)")
                          continue

                      extracted_html, internal_title = (None, "")
                      if f_name.lower().endswith(".epub"):
                          extracted_html, internal_title = parse_epub_bytes(raw_bytes)

                      matched = find_best_book_match(f_name, caption, internal_title)
                      if not matched:
                          unmatched_files.append(f"{f_name} {f'({internal_title})' if internal_title else ''}")
                          continue

                      item_id = str(matched["id"])
                      registry["file_hashes"][sha256_hash] = item_id
                      registry["tg_unique_ids"][f_uniq] = item_id

                      ext = ".epub" if f_name.lower().endswith(".epub") else ".pdf"
                      local_save_path = f"data/files/books/{item_id}{ext}"
                      with open(local_save_path, "wb") as lf:
                          lf.write(raw_bytes)

                      if extracted_html:
                          with open(f"data/books_content/{item_id}.json", "w", encoding="utf-8") as cf:
                              json.dump({
                                  "id": int(item_id),
                                  "name": matched.get("name"),
                                  "html": extracted_html
                              }, cf, ensure_ascii=False)

                      registry["books_done"][item_id] = {
                          "id": int(item_id),
                          "name": matched.get("name"),
                          "format": ext.replace(".", ""),
                          "has_extracted_text": bool(extracted_html),
                          "local_path": local_save_path,
                          "tg_file_id": f_id
                      }
                      newly_added_books.append(f"📗 {matched.get('name')} (#{item_id} - {ext.upper()})")

          # فحص وسحب دفعة من الصوتيات آلياً من السيرفر الأصلي بالترتيب الصحيح دون خربطة الأسماء
          all_audio_items = [it for it in all_items if it.get("is_audio")]
          auto_fetched_audios = 0
          for it in all_audio_items:
              aid = str(it["id"])
              if aid in registry["audios_done"]:
                  continue
              raw_url = (it.get("url") or "").strip()
              if not raw_url or raw_url == "0":
                  continue
              # سحب أول 15 ملف صوتي في كل تشغيلة لمنع بطء السيرفر
              if auto_fetched_audios >= 15:
                  break
              test_urls = [
                  raw_url.replace("http://alamin-library.com", "https://new.alamin-library.com"),
                  raw_url
              ]
              for turl in test_urls:
                  try:
                      r = requests.get(turl, timeout=12, verify=False)
                      if r.status_code == 200 and len(r.content) > 10000 and b"<!DOCTYPE" not in r.content[:200]:
                          save_p = f"data/files/audio/{aid}.mp3"
                          with open(save_p, "wb") as af:
                              af.write(r.content)
                          registry["audios_done"][aid] = {
                              "id": int(aid),
                              "name": it.get("title") or it.get("name"),
                              "category": (it.get("category") or {}).get("name", ""),
                              "local_path": save_p
                          }
                          auto_fetched_audios += 1
                          break
                  except Exception:
                      pass

          all_text_books = [it for it in all_items if not it.get("is_audio")]
          missing_books = [
              {
                  "id": it["id"],
                  "name": it.get("name"),
                  "lang": (it.get("category") or {}).get("language", "ar"),
                  "category": (it.get("category") or {}).get("name", "")
              }
              for it in all_text_books if str(it["id"]) not in registry["books_done"]
          ]

          with open(reg_path, "w", encoding="utf-8") as f:
              json.dump(registry, f, ensure_ascii=False, indent=2)

          with open("data/audit_report.json", "w", encoding="utf-8") as f:
              json.dump({
                  "books_completed": len(registry["books_done"]),
                  "books_total": len(all_text_books),
                  "audios_completed": len(registry["audios_done"]),
                  "audios_total": len(all_audio_items),
                  "unmatched_files": unmatched_files,
                  "missing_books": missing_books
              }, f, ensure_ascii=False, indent=2)

          # إرسال تقرير الجرد الشامل إلى تيليجرام فوراً
          report_lines = [
              "✅ اكتمل الفرز الذكي والجرد الفوري!\n",
              f"📚 الكتب الجاهزة في التطبيق الآن: ({len(registry['books_done'])}) من أصل ({len(all_text_books)}) كتاباً.",
              f"🎧 الصوتيات المفروزة برمجياً: ({len(registry['audios_done'])}) من أصل ({len(all_audio_items)}) درساً.\n"
          ]

          if newly_added_books:
              report_lines.append(f"🎉 كتب تمت إضافتها وتجهيزها للقراءة في هذه الدفعة ({len(newly_added_books)}):")
              report_lines.extend(newly_added_books[:30])
              report_lines.append("")

          if duplicates_skipped:
              report_lines.append(f"♻️ ملفات مكررة تم تجاهلها تلقائياً ({len(duplicates_skipped)}): " + "، ".join(duplicates_skipped[:10]) + "\n")

          if unmatched_files:
              report_lines.append("⚠️ ملفات لم يُطابق اسمها تلقائياً (أرسلها مع رقم الكتاب في الوصف):")
              report_lines.extend([f"  - {x}" for x in unmatched_files[:15]])
              report_lines.append("")

          if missing_books:
              report_lines.append(f"📋 الكتب المتبقية التي لم تصل بعد ({len(missing_books)} كتاباً):")
              for mb in missing_books[:35]:
                  report_lines.append(f"  • [#{mb['id']}] {mb['name']} ({mb['lang'].upper()})")
          else:
              report_lines.append("🏆 ما شاء الله! اكتملت جميع الكتب الـ 95 في التطبيق بنسبة 100%!")

          send_tg("\n".join(report_lines))
          EOF

      - name: Save Sorted Books & Registry to Repository
        run: |
          git config user.name "RohAlquranBot"
          git config user.email "bot@rohalquran.app"
          git add data/
          git diff --staged --quiet || (git commit -m "Auto-sort sent books and update audit registry" && git pull --rebase origin main && git push)
