              18: ("ar", "أركان الإسلام", "الحج - خامس المدارس العليا للتقوى", 5),
              25: ("ar", "أركان الإسلام", "درر الأحكام في شرح أركان الإسلام", 6),

              # 🇸🇾 الكتب العربية - الأنبياء الكرام
              5:  ("ar", "الأنبياء الكرام", "عصمة الأنبياء الكرام عليهم السلام", 2),

              # 🇸🇾 الكتب العربية - دراسات إسلامية
              20: ("ar", "دراسات إسلامية", "لمَ الحجاب ولمَ الطلاق ولمَ أكثر من زوجة يا إسلام", 1),
              7:  ("ar", "دراسات إسلامية", "البحوث المجيدة", 2),
              11: ("ar", "دراسات إسلامية", "الغرب حرر الإنسان من العبودية والإسلام لمَ لم يحرره", 3),
              9:  ("ar", "دراسات إسلامية", "صواعق معجزات أم الكتاب", 4),
