name: Build Library Database

on:
  push:
    paths:
      - '.github/workflows/setup.yml'
  workflow_dispatch:

jobs:
  fetch-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch Quran & Amin Sheikho Library
        env:
          BOT_TOKEN: ${{ secrets.BO_TOKEN }}
          ADMIN_ID: "5205216077"
          CHANNEL_ID: "-1004482762316"
        run: |
          cat << 'EOF' > build_db.py
          import os, json, re, time
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, unquote

          TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          ADMIN_ID = os.environ.get("ADMIN_ID", "").strip()
          CHANNEL_ID = os.environ.get("CHANNEL_ID", "").strip()

          os.makedirs("data", exist_ok=True)
          headers = {"User-Agent": "Mozilla/5.0 (Linux; Android 14; Tab S11) AppleWebKit/537.36"}

          def tg_msg(chat_id, text):
              try:
                  requests.post(
                      f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                      json={"chat_id": chat_id, "text": text, "parse_mode": "Markdown"},
                      timeout=15
                  )
              except Exception as e:
                  print("TG error:", e)

          def tg_doc(chat_id, filepath, caption):
              try:
                  with open(filepath, "rb") as f:
                      requests.post(
                          f"https://api.telegram.org/bot{TOKEN}/sendDocument",
                          data={"chat_id": chat_id, "caption": caption},
                          files={"document": f},
                          timeout=30
                      )
              except Exception as e:
                  print("TG doc error:", e)

          tg_msg(ADMIN_ID, "⏳ *بدأت الآن عملية سحب المصحف الشريف وفهرسة كتب وصوتيات الموقع الرسمي...*\nسأرسل لك التقرير خلال دقيقة واحدة.")

          # 1. جلب بيانات المصحف الشريف بالرسم العثماني وأرقام الصفحات والأجزاء
          print("Fetching Quran Uthmani...")
          try:
              q_resp = requests.get("https://api.alquran.cloud/v1/quran/quran-uthmani", timeout=30).json()
              if q_resp.get("code") == 200:
                  surahs = q_resp["data"]["surahs"]
                  with open("data/quran.json", "w", encoding="utf-8") as f:
                      json.dump(surahs, f, ensure_ascii=False)
                  print(f"Saved {len(surahs)} Surahs.")
          except Exception as e:
              print("Quran fetch error:", e)

          # 2. جلب الكتب والصوتيات من الموقع الرسمي عبر واجهة ووردبريس/المتجر والصفحات
          books = []
          seen_urls = set()

          def extract_page_details(url, default_title="", default_cat=""):
              try:
                  r = requests.get(url, headers=headers, timeout=15)
                  soup = BeautifulSoup(r.text, "lxml")
                  title_el = soup.find("h1")
                  title = title_el.get_text(strip=True) if title_el else default_title

                  pdfs, epubs, mp3s = [], [], []
                  for a in soup.find_all("a", href=True):
                      href = urljoin(url, a["href"])
                      low = href.lower()
                      if ".pdf" in low and href not in pdfs:
                          pdfs.append(href)
                      elif ".epub" in low and href not in epubs:
                          epubs.append(href)
                      elif ".mp3" in low and href not in mp3s:
                          mp3s.append({"title": a.get_text(strip=True) or os.path.basename(unquote(href)), "url": href})

                  desc = ""
                  meta_desc = soup.find("meta", {"property": "og:description"}) or soup.find("meta", {"name": "description"})
                  if meta_desc and meta_desc.get("content"):
                      desc = meta_desc["content"].strip()

                  img = ""
                  meta_img = soup.find("meta", {"property": "og:image"})
                  if meta_img and meta_img.get("content"):
                      img = meta_img["content"].strip()

                  return {
                      "title": title,
                      "url": url,
                      "category": default_cat,
                      "description": desc,
                      "cover": img,
                      "pdf": pdfs,
                      "epub": epubs,
                      "audio": mp3s
                  }
              except Exception as e:
                  return None

          # فحص واجهة WooCommerce Store API و WP REST API
          for ep in [
              "https://www.amin-sheikho.com/wp-json/wc/store/products?per_page=100",
              "https://www.amin-sheikho.com/wp-json/wp/v2/product?per_page=100",
              "https://www.amin-sheikho.com/wp-json/wp/v2/posts?per_page=100"
          ]:
              try:
                  res = requests.get(ep, headers=headers, timeout=20)
                  if res.status_code == 200:
                      items = res.json()
                      if isinstance(items, list):
                          for item in items:
                              link = item.get("permalink") or item.get("link")
                              if link and link not in seen_urls:
                                  seen_urls.add(link)
                                  t = item.get("name") or (item.get("title", {}).get("rendered") if isinstance(item.get("title"), dict) else "")
                                  cats = [c.get("name", "") for c in item.get("categories", []) if isinstance(c, dict)]
                                  cat_str = "، ".join(cats) if cats else "كتب ومؤلفات"
                                  info = extract_page_details(link, t, cat_str)
                                  if info:
                                      books.append(info)
              except Exception as e:
                  print("API check error:", ep, e)

          # فحص خريطة الموقع والصفحة الرئيسية في حال وجود روابط إضافية
          try:
              home = requests.get("https://www.amin-sheikho.com/", headers=headers, timeout=20)
              soup = BeautifulSoup(home.text, "lxml")
              for a in soup.find_all("a", href=True):
                  href = urljoin("https://www.amin-sheikho.com/", a["href"])
                  if "amin-sheikho.com" in href and any(k in unquote(href) for k in ["/product/", "/book", "/audio", "تأويل", "كتاب"]):
                      if href not in seen_urls and len(books) < 120:
                          seen_urls.add(href)
                          info = extract_page_details(href, a.get_text(strip=True), "المكتبة")
                          if info and (info["pdf"] or info["epub"] or info["audio"] or info["title"]):
                              books.append(info)
          except Exception as e:
              print("Home scan error:", e)

          library_data = {
              "project": "روح القرآن ونعيمه",
              "updated_at": time.strftime("%Y-%m-%d %H:%M:%S"),
              "total_items": len(books),
              "items": books
          }

          with open("data/library.json", "w", encoding="utf-8") as f:
              json.dump(library_data, f, ensure_ascii=False, indent=2)

          pdf_count = sum(len(b["pdf"]) for b in books)
          epub_count = sum(len(b["epub"]) for b in books)
          audio_count = sum(len(b["audio"]) for b in books)

          summary = (
              "✅ *اكتمل بناء قاعدة البيانات الأولية لمشروع (روح القرآن ونعيمه)!*\n\n"
              f"📖 *سور المصحف الشريف:* 114 سورة (بالرسم العثماني الكامل)\n"
              f"📚 *عدد صفحات وعناصر المكتبة المفحوصة:* {len(books)}\n"
              f"📄 *روابط PDF المكتشفة:* {pdf_count}\n"
              f"📱 *روابط ePUB التفاعلية المكتشفة:* {epub_count}\n"
              f"🎧 *المقاطع الصوتية المكتشفة:* {audio_count}\n\n"
              "📎 مرفق لك ملف الفهرس المسحوب (`library.json`)."
          )

          tg_msg(ADMIN_ID, summary)
          tg_doc(ADMIN_ID, "data/library.json", "ملف فهرس المكتبة المسحوب آلياً")
          EOF
          python3 build_db.py

      - name: Commit and Push Database to Repository
        run: |
          git config user.name "RohAlquranBot"
          git config user.email "bot@rohalquran.app"
          git add data/
          git diff --staged --quiet || git commit -m "Auto-update Quran and Library database"
          git push
