name: Read Saved Report Summary

on:
  push:
    paths:
      - '.github/workflows/setup.yml'
  workflow_dispatch:

jobs:
  summarize-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install requests
        run: pip install requests

      - name: Send Readable Summary to Telegram Chat
        env:
          BOT_TOKEN: ${{ secrets.BO_TOKEN }}
          ADMIN_ID: "5205216077"
        run: |
          python3 - << 'EOF'
          import os, json, requests
          from collections import Counter

          TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          ADMIN_ID = os.environ.get("ADMIN_ID", "").strip()

          def send_txt(txt):
              requests.post(
                  f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                  json={"chat_id": ADMIN_ID, "text": txt[:4000]},
                  timeout=15
              )

          with open("data/apk_unpack_report.json", "r", encoding="utf-8") as f:
              rep = json.load(f)

          urls = rep.get("discovered_urls", [])
          files = rep.get("interesting_files", [])
          jsons = rep.get("json_files_preview", {})

          # تجميع المجلدات وأكبر الملفات حجماً
          folders = Counter("/".join(x["name"].split("/")[:-1]) for x in files)
          biggest = sorted(files, key=lambda x: x["size"], reverse=True)[:20]

          msg1 = "🌐 الروابط الـ 14 المكتشفة داخل التطبيق:\n" + "\n".join(f"- {u}" for u in urls)
          msg1 += "\n\n📂 توزيع المجلدات داخل الحزمة:\n" + "\n".join(f"- {k}: {v} ملف" for k, v in folders.most_common(15))
          msg1 += "\n\n📦 أكبر 20 ملفاً داخل التطبيق:\n" + "\n".join(f"- {x['name']} ({round(x['size']/1024, 1)} KB)" for x in biggest)
          send_txt(msg1)

          # إرسال أسماء أول 30 ملف JSON مع عينة من محتواها
          json_keys = list(jsons.keys())
          msg2 = f"📑 إجمالي ملفات JSON المكتشفة: {len(json_keys)}\n\nأمثلة لأسماء ملفات JSON:\n"
          msg2 += "\n".join(f"- {k}" for k in json_keys[:25])
          msg2 += "\n\n🔍 عينة من داخل أول 4 ملفات JSON:\n"
          for k in json_keys[:4]:
              msg2 += f"\n--- [{k}] ---\n{jsons[k][:300]}\n"
          send_txt(msg2)
          EOF
