name: Cloud APK & Cart Books Extractor

on:
  push:
    paths:
      - '.github/workflows/setup.yml'
  workflow_dispatch:

jobs:
  extract-app-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: pip install requests beautifulsoup4 lxml cloudscraper

      - name: Extract Cart Downloads & APK Structure
        env:
          BOT_TOKEN: ${{ secrets.BO_TOKEN }}
          ADMIN_ID: "5205216077"
        run: |
          cat << 'EOF' > cloud_extractor.py
          import os, re, json, zipfile
          import requests, cloudscraper
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, unquote

          TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          ADMIN_ID = os.environ.get("ADMIN_ID", "").strip()
          PKG = "com.aminsheikho.alaminlibrary"
          scraper = cloudscraper.create_scraper()

          def tg_msg(text):
              requests.post(
                  f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                  json={"chat_id": ADMIN_ID, "text": text, "parse_mode": "Markdown"},
                  timeout=15
              )

          def tg_doc(path, caption):
              with open(path, "rb") as f:
                  requests.post(
                      f"https://api.telegram.org/bot{TOKEN}/sendDocument",
                      data={"chat_id": ADMIN_ID, "caption": caption},
                      files={"document": f},
                      timeout=30
                  )

          tg_msg("⏳ *بدأ السيرفر الآن بفحص روابط التحميل المخفية وسحب بيانات الحزمة...*")

          report = {
              "apk_found": False,
              "apk_source": "",
              "apk_files": [],
              "discovered_apis": [],
              "cart_and_download_inspect": [],
              "raw_shortcodes_found": []
          }

          # 1. فحص محتوى الكود الخام للمنتجات (لماذا ظهر [box type="download"] في الكتب؟)
          try:
              r_prod = scraper.get("https://www.amin-sheikho.com/wp-json/wp/v2/product?per_page=15", timeout=20)
              if r_prod.status_code == 200:
                  for p in r_prod.json()[:8]:
                      title = (p.get("title") or {}).get("rendered", "")
                      content_html = (p.get("content") or {}).get("rendered", "")
                      link = p.get("link", "")
                      soup_c = BeautifulSoup(content_html, "lxml")
                      links_in_content = [a.get("href") for a in soup_c.find_all("a", href=True)]
                      report["raw_shortcodes_found"].append({
                          "title": title,
                          "url": link,
                          "links_inside_content": links_in_content,
                          "html_sample": content_html[:600]
                      })
          except Exception as e:
              report["wp_product_error"] = str(e)

          # 2. فحص أزرار (add-to-cart) وروابط التحميل المباشرة داخل صفحات الكتب
          try:
              test_urls = [item["url"] for item in report["raw_shortcodes_found"][:4] if item.get("url")]
              for u in test_urls:
                  page_res = scraper.get(u, timeout=15)
                  soup = BeautifulSoup(page_res.text, "lxml")
                  dl_elements = []
                  for a in soup.find_all("a", href=True):
                      href = a["href"]
                      txt = a.get_text(strip=True)
                      if any(k in href.lower() or k in txt for k in ["add-to-cart", "download", "epub", "pdf", "mp3", "سلة", "تحميل", "صيغ"]):
                          dl_elements.append({"text": txt, "href": href})

                  # تجربة تتبع أول رابط add-to-cart لمعرفة ماذا يعطي السيرفر
                  cart_result = ""
                  for el in dl_elements:
                      if "add-to-cart=" in el["href"]:
                          cart_url = urljoin(u, el["href"])
                          c_resp = scraper.get(cart_url, timeout=15)
                          c_soup = BeautifulSoup(c_resp.text, "lxml")
                          c_links = [ca["href"] for ca in c_soup.find_all("a", href=True) if any(x in ca["href"].lower() for x in ["checkout", "download", "epub", "pdf", "cart"])]
                          cart_result = {"tested_url": cart_url, "result_links": c_links[:10]}
                          break

                  report["cart_and_download_inspect"].append({
                      "page": u,
                      "buttons": dl_elements[:15],
                      "cart_Simulation": cart_result
                  })
          except Exception as e:
              report["cart_error"] = str(e)

          # 3. محاولة سحب معلومات وحزمة التطبيق من Aptoide API
          apk_path = "alamin.apk"
          try:
              apt_url = f"https://ws75.aptoide.com/api/7/app/get/package_name={PKG}"
              r = requests.get(apt_url, timeout=15)
              if r.status_code == 200:
                  data = r.json()
                  dl_url = (((data.get("nodes") or {}).get("meta") or {}).get("data") or {}).get("file", {}).get("path")
                  if dl_url:
                      report["apk_source"] = dl_url
                      apk_bin = requests.get(dl_url, timeout=60).content
                      with open(apk_path, "wb") as f:
                          f.write(apk_bin)
                      report["apk_found"] = True
          except Exception as e:
              report["aptoide_note"] = str(e)

          if report["apk_found"] and os.path.exists(apk_path) and zipfile.is_zipfile(apk_path):
              urls_found = set()
              with zipfile.ZipFile(apk_path, "r") as z:
                  for name in z.namelist():
                      if any(k in name.lower() for k in ["assets/", "res/raw/", ".db", ".sqlite", ".json", ".epub", "libapp.so", "classes.dex"]):
                          report["apk_files"].append(name)
                      if name.endswith((".dex", ".so", ".json", ".xml")) and z.getinfo(name).file_size < 25000000:
                          try:
                              raw_bytes = z.read(name)
                              for m in re.findall(rb'https?://[a-zA-Z0-9._/-]{8,120}', raw_bytes):
                                  u_str = m.decode("utf-8", errors="ignore")
                                  if not any(ig in u_str for ig in ["schemas.android", "w3.org", "google.com/apk", "apache.org", "facebook.com", "github.com"]):
                                      urls_found.add(u_str)
                          except Exception:
                              pass
              report["discovered_apis"] = sorted(list(urls_found))[:150]

          os.makedirs("data", exist_ok=True)
          with open("data/cloud_extract_report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)

          summary = (
              "✅ *اكتمل الفحص بنجاح!*\n\n"
              f"📦 *فحص حزمة APK السحابي:* {'تم السحب ✔️' if report['apk_found'] else 'غير مرفوع على Aptoide'}\n"
              f"🛒 *صفحات الكتب وسلة التحميل المفحوصة:* {len(report['cart_and_download_inspect'])}\n\n"
              "📎 مرفق ملف (`cloud_extract_report.json`)، افتحه وصوّره أو انسخ محتواه لي هنا!"
          )
          tg_msg(summary)
          tg_doc("data/cloud_extract_report.json", "تقرير فحص روابط الكتب والحزمة")
          EOF
          python3 cloud_extractor.py
