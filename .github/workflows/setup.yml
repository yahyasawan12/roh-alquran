              14: ("ar", "سيرة حياة العلامة", "صفحات من المجد الخالد", 1),

              # 🇸🇾 الكتب العربية - سؤال وجواب
              3:  ("ar", "سؤال وجواب", "كتاب سؤال وجواب", 1),

              # 🇸🇾 الكتب العربية - المناهج التعليمية
              1:  ("ar", "المناهج التعليمية", "التربية الإسلامية للناشئة - المستوى الأول", 1),
              2:  ("ar", "المناهج التعليمية", "التربية الإسلامية للناشئة - المستوى الثاني", 2),
              16: ("ar", "المناهج التعليمية", "التربية الإسلامية للناشئة - المستوى الثالث", 3),
