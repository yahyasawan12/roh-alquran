name: Curate 80 Books, Fix Formatting, Fetch Covers & Build Search/Tafsir Index

on:
  push:
    paths:
      - '.github/workflows/setup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python Libraries
        run: pip install requests beautifulsoup4 lxml pymupdf urllib3

      - name: Re-Format Books, Apply Categories, Download Covers & Index New Files
        env:
          BOT_TOKEN: ${{ secrets.BO_TOKEN }}
          ADMIN_ID: "5205216077"
        run: |
          python3 - << 'EOF'
          import os, re, io, json, hashlib, zipfile, urllib3
          import xml.etree.ElementTree as ET
          import requests
          import fitz
          from bs4 import BeautifulSoup
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          ADMIN_ID = str(os.environ.get("ADMIN_ID", "5205216077")).strip()

          def send_tg(text):
              last_mid = None
              for i in range(0, len(text), 3800):
                  try:
                      r = requests.post(
                          f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                          json={"chat_id": ADMIN_ID, "text": text[i:i+3800]},
                          timeout=20
                      ).json()
                      if r.get("ok"):
                          last_mid = r["result"]["message_id"]
                  except Exception:
                      pass
              return last_mid

          os.makedirs("data/user_books", exist_ok=True)
          os.makedirs("data/covers", exist_ok=True)

          # ================== 1. جدول التنقيح والتصنيف الدقيق للكتب الـ 80 ==================
