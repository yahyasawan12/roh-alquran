name: Bot Admin Command Center, Multi-Line Quiz Manager & Book File Manager

on:
  push:
    paths:
      - '.github/workflows/setup.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  bot-admin-cms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python Libraries
        run: pip install requests beautifulsoup4 lxml pymupdf urllib3

      - name: Register Slash Menu & Execute Admin/Sub-Admin Commands
        env:
          BOT_TOKEN: ${{ secrets.BO_TOKEN }}
          SUPER_ADMIN_ID: "5205216077"
        run: |
          python3 - << 'EOF'
          import os, re, io, json, hashlib, zipfile, urllib3
          import requests, fitz
          from bs4 import BeautifulSoup
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          SUPER_ADMIN_ID = str(os.environ.get("SUPER_ADMIN_ID", "5205216077")).strip()

          os.makedirs("data/user_books", exist_ok=True)

          # 1. تسجيل قائمة أوامر البوت في تيليجرام لتظهر تلقائياً عند كتابة (/) على الكيبورد
          bot_commands = [
              {"command": "help", "description": "📋 عرض قائمة جميع الأوامر وشرحها"},
              {"command": "quizzes", "description": "🧠 عرض جميع الاختبارات مرقمة"},
              {"command": "add_auto_quiz", "description": "➕ إضافة اختبار مؤتمت (عدة أسطر)"},
              {"command": "add_trad_quiz", "description": "➕ إضافة اختبار تقليدي (سؤال وجواب)"},
              {"command": "del_quiz", "description": "🗑️ حذف سؤال برقم (مثال: /del_quiz 2)"},
              {"command": "edit_quiz", "description": "✏️ تعديل سؤال برقم (مثال: /edit_quiz 2)"},
              {"command": "add_admin", "description": "👤 إضافة أدمن اختبارات باليوزر (للمالك فقط)"},
              {"command": "del_admin", "description": "🚫 حذف أدمن فرعي (للمالك فقط)"},
              {"command": "add_file", "description": "📤 إضافة كتاب جديد مع اللغة والقسم (للمالك فقط)"},
              {"command": "books_list", "description": "📚 عرض قائمة الكتب وأرقامها الإدارية (للمالك فقط)"},
              {"command": "del_file", "description": "🗑️ حذف ملف كتاب برقمه (للمالك فقط)"}
          ]
          try:
              requests.post(
                  f"https://api.telegram.org/bot{TOKEN}/setMyCommands",
                  json={"commands": bot_commands},
                  timeout=15
              )
          except Exception:
              pass

          def send_tg(chat_id, text):
              for i in range(0, len(text), 3800):
                  try:
                      requests.post(
                          f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                          json={"chat_id": chat_id, "text": text[i:i+3800]},
                          timeout=20
                      )
                  except Exception:
                      pass

          # 2. تحميل ملفات الحالة (الأدمن، الاختبارات، وكتالوج الكتب)
          admins_path = "data/admins.json"
          if os.path.exists(admins_path):
              with open(admins_path, "r", encoding="utf-8") as f:
                  admins_state = json.load(f)
          else:
              admins_state = {"sub_admin_usernames": [], "sub_admin_ids": [], "pending_upload": None, "last_update_id": 0}

          quiz_path = "data/quizzes.json"
          if os.path.exists(quiz_path):
              with open(quiz_path, "r", encoding="utf-8") as f:
                  quizzes = json.load(f)
          else:
              quizzes = [
                  {
                      "type": "auto",
                      "q": "ما هي الآية الكريمة التي تبيّن أن منهاج الدعوة إلى الله يقوم على البصيرة؟",
                      "options": [
                          "﴿قُلْ هَٰذِهِ سَبِيلِي أَدْعُو إِلَى اللَّهِ عَلَىٰ بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي﴾ [يوسف: 108]",
                          "﴿ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ﴾ [النحل: 125]",
                          "﴿وَمَنْ أَحْسَنُ قَوْلًا مِّمَّن دَعَا إِلَى اللَّهِ﴾ [فصلت: 33]"
                      ],
                      "correct": 0,
                      "explain": "تتصدر آية سورة يوسف (108) منهج «دعوتنا إلى الله»."
                  }
              ]

          catalog_path = "data/user_books_catalog.json"
          if os.path.exists(catalog_path):
              with open(catalog_path, "r", encoding="utf-8") as f:
                  catalog_state = json.load(f)
          else:
              catalog_state = {"next_num": 94, "scanned_msg_ids": [], "file_hashes": {}, "books": [], "deleted_nums": []}

          if "deleted_nums" not in catalog_state:
              catalog_state["deleted_nums"] = []

          HELP_MENU = (
              "📋 لوحة أوامر إدارة تطبيق «روح القرآن ونعيمه»:\n\n"
              "━━ 🧠 أولاً: أوامر الاختبارات (للمالك والأدمن) ━━\n"
              "1️⃣ عرض كل الاختبارات مرقمة:\n"
              "/quizzes\n\n"
              "2️⃣ إضافة اختبار مؤتمت (تكتب كل عنصر بسطر جديد):\n"
              "/add_auto_quiz\n"
              "السؤال هنا\n"
              "الإجابة الصحيحة هنا\n"
              "الإجابة الخاطئة الأولى\n"
              "الإجابة الخاطئة الثانية\n\n"
              "3️⃣ إضافة اختبار تقليدي (سؤال واضغط لعرض الإجابة):\n"
              "/add_trad_quiz\n"
              "السؤال هنا\n"
              "الإجابة الصحيحة والشرح هنا\n\n"
              "4️⃣ حذف سؤال برقمه:\n"
              "/del_quiz 2\n\n"
              "5️⃣ تعديل سؤال برقمه (بنفس صيغة الأسطر):\n"
              "/edit_quiz 2\n"
              "السؤال الجديد\n"
              "الإجابة الصحيحة الجديدة\n"
              "إجابة خاطئة 1 (اختياري)\n\n"
              "━━ 🔐 ثانياً: أوامر المالك الحصرية (لك فقط) ━━\n"
              "6️⃣ إضافة أو حذف أدمن اختبارات باليوزر:\n"
              "/add_admin @username\n"
              "/del_admin @username\n\n"
              "7️⃣ إضافة ملف كتاب جديد للتطبيق:\n"
              "أرسل الأمر التالي بـ 3 أسطر ثم أرسل الملف بعده (أو ضعه بوصف الملف):\n"
              "/add_file\n"
              "عربي (أو فرنسي أو انكليزي)\n"
              "دراسات إسلامية (اسم القسم)\n\n"
              "8️⃣ عرض الكتب بأرقامها أو حذف ملف كتاب:\n"
              "/books_list\n"
              "/del_file 85"
          )

          def normalize_lang_input(s):
              s = s.strip().lower()
              if any(w in s for w in ["فرنس", "fr", "francais", "français"]): return "fr"
              if any(w in s for w in ["انكل", "انجل", "en", "english"]): return "en"
              return "ar"

          def extract_book_chapters_from_bytes(raw_bytes, fname):
              ext = "epub" if fname.lower().endswith(".epub") else "pdf"
              chapters = []
              if ext == "epub":
                  try:
                      with zipfile.ZipFile(io.BytesIO(raw_bytes), 'r') as z:
                          html_files = sorted([n for n in z.namelist() if n.lower().endswith(('.xhtml', '.html', '.htm'))])
                          for idx, hf in enumerate(html_files, 1):
                              r_html = z.read(hf).decode('utf-8', errors='ignore')
                              sp = BeautifulSoup(r_html, 'lxml')
                              for t in sp(['script', 'style', 'head', 'nav']): t.decompose()
                              h_tags = [h.get_text(strip=True) for h in sp.find_all(['h1', 'h2', 'h3']) if h.get_text(strip=True)]
                              ctitle = h_tags[0] if h_tags else f"المبحث {idx}"
                              paras = [f"<p>{ln.strip()}</p>" for ln in sp.get_text("\n").split("\n") if ln.strip()]
                              if len(paras) > 1:
                                  chapters.append({"idx": len(chapters)+1, "title": ctitle[:75], "html": "\n".join(paras)})
                  except Exception:
                      pass
              else:
                  try:
                      pdf_doc = fitz.open(stream=raw_bytes, filetype="pdf")
                      total_p = len(pdf_doc)
                      for start_p in range(0, total_p, 8):
                          end_p = min(total_p, start_p + 8)
                          p_list = []
                          for pno in range(start_p, end_p):
                              pt = pdf_doc[pno].get_text("text").strip()
                              if pt:
                                  p_list.extend([f"<p>{ln.strip()}</p>" for ln in pt.split("\n") if ln.strip()])
                          if p_list:
                              chapters.append({"idx": len(chapters)+1, "title": f"المبحث {len(chapters)+1}", "html": "\n".join(p_list)})
                  except Exception:
                      pass
              return ext, chapters

          offset = admins_state.get("last_update_id", 0) + 1
          up_res = requests.get(f"https://api.telegram.org/bot{TOKEN}/getUpdates?offset={offset}&limit=100", timeout=25).json()

          for u in up_res.get("result", []):
              admins_state["last_update_id"] = u["update_id"]
              msg = u.get("message") or {}
              sender = msg.get("from") or {}
              sender_id = str(sender.get("id", ""))
              sender_uname = (sender.get("username") or "").lower().strip()
              chat_id = msg.get("chat", {}).get("id", sender_id)
              text = (msg.get("text") or msg.get("caption") or "").strip()
              doc = msg.get("document")

              is_owner = (sender_id == SUPER_ADMIN_ID)
              is_sub_admin = (
                  sender_id in admins_state.get("sub_admin_ids", []) or
                  (sender_uname and sender_uname in admins_state.get("sub_admin_usernames", []))
              )

              if not (is_owner or is_sub_admin):
                  continue

              lines = [ln.strip() for ln in text.split("\n") if ln.strip()]
              cmd_head = lines[0].split()[0].lower() if lines else ""

              # 1. قائمة الأوامر التذكيرية
              if cmd_head in ["/start", "/help", "/commands", "اوامر", "الأوامر", "/"]:
                  send_tg(chat_id, HELP_MENU)
                  continue

              # 2. عرض كل الاختبارات مرقمة بترتيب ثابت في البوت
              if cmd_head == "/quizzes":
                  if not quizzes:
                      send_tg(chat_id, "📭 لا توجد اختبارات حالياً.")
                  else:
                      out = [f"🧠 قائمة الاختبارات الحالية ({len(quizzes)} سؤال):\n"]
                      for idx, qz in enumerate(quizzes, 1):
                          qtype = "مؤتمت (خيارات)" if qz.get("type") != "trad" and qz.get("options") else "تقليدي (كشف الجواب)"
                          out.append(f"🔢 سؤال رقم [{idx}] ({qtype}):\n❓ {qz.get('q')}")
                          if qz.get("options"):
                              corr_i = qz.get("correct", 0)
                              out.append(f"✅ الجواب الصحيح: {qz['options'][corr_i]}")
                          else:
                              out.append(f"✅ الجواب: {qz.get('explain', '')}")
                          out.append("────────────")
                      send_tg(chat_id, "\n".join(out))
                  continue

              # 3. إضافة اختبار مؤتمت بعدة أسطر
              if cmd_head == "/add_auto_quiz":
                  if len(lines) < 3:
                      send_tg(chat_id, "⚠️ يرجى كتابة الأمر وتحته بسطر السؤال، وتحته بسطر الإجابة الصحيحة، وتحته كل إجابة خاطئة بسطر:\n\n/add_auto_quiz\nالسؤال\nالإجابة الصحيحة\nالإجابة الخاطئة 1\nالإجابة الخاطئة 2")
                      continue
                  q_text = lines[1]
                  correct_ans = lines[2]
                  wrong_opts = lines[3:]
                  all_opts = [correct_ans] + wrong_opts
                  quizzes.append({
                      "type": "auto",
                      "q": q_text,
                      "options": all_opts,
                      "correct": 0,
                      "explain": f"الإجابة الصحيحة: {correct_ans}"
                  })
                  send_tg(chat_id, f"✅ تم إضافة الاختبار المؤتمت بنجاح وأصبح رقمه في البوت: [{len(quizzes)}]")
                  continue

              # 4. إضافة اختبار تقليدي (سؤال + إجابة فقط)
              if cmd_head == "/add_trad_quiz":
                  if len(lines) < 3:
                      send_tg(chat_id, "⚠️ يرجى كتابة الأمر وتحته بسطر السؤال، وتحته بسطر الإجابة الصحيحة:\n\n/add_trad_quiz\nالسؤال هنا\nالإجابة الصحيحة هنا")
                      continue
                  q_text = lines[1]
                  ans_text = "\n".join(lines[2:])
                  quizzes.append({
                      "type": "trad",
                      "q": q_text,
                      "options": [],
                      "correct": 0,
                      "explain": ans_text
                  })
                  send_tg(chat_id, f"✅ تم إضافة الاختبار التقليدي بنجاح وأصبح رقمه في البوت: [{len(quizzes)}]")
                  continue

              # 5. حذف سؤال برقمه
              if cmd_head == "/del_quiz":
                  parts = lines[0].split()
                  num_str = parts[1] if len(parts) > 1 else (lines[1] if len(lines) > 1 else "")
                  if num_str.isdigit():
                      q_idx = int(num_str) - 1
                      if 0 <= q_idx < len(quizzes):
                          removed = quizzes.pop(q_idx)
                          send_tg(chat_id, f"🗑️ تم حذف السؤال رقم [{num_str}]:\n({removed.get('q')})")
                      else:
                          send_tg(chat_id, "⚠️ رقم السؤال غير موجود. أرسل /quizzes لعرض الأرقام.")
                  else:
                      send_tg(chat_id, "⚠️ أرسل رقم السؤال بعد الأمر، مثال:\n/del_quiz 2")
                  continue

              # 6. تعديل سؤال برقمه
              if cmd_head == "/edit_quiz":
                  parts = lines[0].split()
                  num_str = parts[1] if len(parts) > 1 else ""
                  if not num_str.isdigit() or len(lines) < 3:
                      send_tg(chat_id, "⚠️ لتعديل سؤال أرسل مثلاً:\n/edit_quiz 1\nالسؤال المعدل\nالإجابة الصحيحة المعدلة\nإجابة خاطئة 1 (اختياري)")
                      continue
                  q_idx = int(num_str) - 1
                  if 0 <= q_idx < len(quizzes):
                      q_text = lines[1]
                      correct_ans = lines[2]
                      wrong_opts = lines[3:]
                      if wrong_opts:
                          quizzes[q_idx] = {
                              "type": "auto",
                              "q": q_text,
                              "options": [correct_ans] + wrong_opts,
                              "correct": 0,
                              "explain": f"الإجابة الصحيحة: {correct_ans}"
                          }
                      else:
                          quizzes[q_idx] = {
                              "type": "trad",
                              "q": q_text,
                              "options": [],
                              "correct": 0,
                              "explain": correct_ans
                          }
                      send_tg(chat_id, f"✅ تم تعديل السؤال رقم [{num_str}] بنجاح!")
                  else:
                      send_tg(chat_id, "⚠️ رقم السؤال غير موجود.")
                  continue

              # ================== أوامر المالك الحصرية (إدارة الأدمن وإضافة/حذف الملفات) ==================
              if cmd_head in ["/add_admin", "/del_admin", "/add_file", "/del_file", "/books_list"]:
                  if not is_owner:
                      send_tg(chat_id, "⛔ عذراً، هذا الأمر مخصص لمالك التطبيق حصراً. صلاحيتك تقتصر على إدارة الاختبارات.")
                      continue

                  if cmd_head == "/add_admin":
                      target = lines[0].replace("/add_admin", "").strip().lstrip("@").lower()
                      if not target and len(lines) > 1:
                          target = lines[1].lstrip("@").lower()
                      if target:
                          if target.isdigit():
                              if target not in admins_state["sub_admin_ids"]:
                                  admins_state["sub_admin_ids"].append(target)
                          else:
                              if target not in admins_state["sub_admin_usernames"]:
                                  admins_state["sub_admin_usernames"].append(target)
                          send_tg(chat_id, f"✅ تم إضافة (@{target}) كأدمن فرعي بصلاحية إدارة الاختبارات فقط.")
                      else:
                          send_tg(chat_id, "⚠️ أرسل يوزر الأدمن بعد الأمر، مثال:\n/add_admin @username")
                      continue

                  if cmd_head == "/del_admin":
                      target = lines[0].replace("/del_admin", "").strip().lstrip("@").lower()
                      if target in admins_state["sub_admin_usernames"]:
                          admins_state["sub_admin_usernames"].remove(target)
                      if target in admins_state["sub_admin_ids"]:
                          admins_state["sub_admin_ids"].remove(target)
                      send_tg(chat_id, f"🗑️ تم إلغاء صلاحية الأدمن (@{target}) بنجاح.")
                      continue

                  if cmd_head == "/books_list":
                      b_lines = ["📚 قائمة الكتب وأرقامها الإدارية (للحذف عبر /del_file):\n"]
                      for b in catalog_state.get("books", []):
                          if b["num"] not in catalog_state["deleted_nums"]:
                              b_lines.append(f"• [{b['num']}] : {b['title']} ({b.get('lang','ar').upper()} - {b.get('category','')})")
                      send_tg(chat_id, "\n".join(b_lines))
                      continue

                  if cmd_head == "/del_file":
                      parts = lines[0].split()
                      b_num_str = parts[1] if len(parts) > 1 else (lines[1] if len(lines) > 1 else "")
                      if b_num_str.isdigit():
                          bnum = int(b_num_str)
                          if bnum not in catalog_state["deleted_nums"]:
                              catalog_state["deleted_nums"].append(bnum)
                          catalog_state["books"] = [b for b in catalog_state.get("books", []) if int(b["num"]) != bnum]
                          bpath = f"data/user_books/{bnum}.json"
                          if os.path.exists(bpath):
                              os.remove(bpath)
                          send_tg(chat_id, f"🗑️ تم حذف الكتاب رقم [{bnum}] من التطبيق بنجاح!")
                      else:
                          send_tg(chat_id, "⚠️ أرسل رقم الكتاب بعد الأمر، مثال:\n/del_file 85")
                      continue

                  if cmd_head == "/add_file":
                      if len(lines) >= 3:
                          lang_code = normalize_lang_input(lines[1])
                          cat_name = lines[2]
                          custom_title = lines[3] if len(lines) >= 4 else ""
                          admins_state["pending_upload"] = {"lang": lang_code, "category": cat_name, "title": custom_title}
                          if not doc:
                              send_tg(chat_id, f"📌 تم تجهيز إعدادات الرفع:\n• اللغة: {lang_code.upper()}\n• القسم: {cat_name}\n\n📤 أرسل ملف الكتاب (EPUB أو PDF) الآن ليتم تثبيته فوراً!")
                      else:
                          send_tg(chat_id, "⚠️ لإضافة كتاب أرسل 3 أسطر:\n/add_file\nعربي (أو فرنسي / انكليزي)\nاسم القسم (مثل: دراسات إسلامية)\nاسم الكتاب (اختياري)")
                          continue

              # إذا أرسل المالك ملف كتاب (مع أمر /add_file أو بعده)
              if is_owner and doc and admins_state.get("pending_upload"):
                  up_cfg = admins_state["pending_upload"]
                  fname = doc.get("file_name") or "book.epub"
                  fsize = doc.get("file_size", 0)
                  fid = doc.get("file_id")
                  if fsize < 19950000 and (fname.lower().endswith(".epub") or fname.lower().endswith(".pdf")):
                      finfo = requests.get(f"https://api.telegram.org/bot{TOKEN}/getFile?file_id={fid}", timeout=20).json()
                      fpath = (finfo.get("result") or {}).get("file_path")
                      if fpath:
                          raw_b = requests.get(f"https://api.telegram.org/file/bot{TOKEN}/{fpath}", timeout=55).content
                          ext, chaps = extract_book_chapters_from_bytes(raw_b, fname)
                          if chaps:
                              bnum = max(catalog_state.get("next_num", 94), 94)
                              catalog_state["next_num"] = bnum + 1
                              final_title = up_cfg.get("title") or re.sub(r'\.(epub|pdf)$', '', fname, flags=re.I)
                              catalog_state["books"].append({
                                  "num": bnum,
                                  "title": final_title,
                                  "lang": up_cfg["lang"],
                                  "category": up_cfg["category"],
                                  "sort_order": 50,
                                  "custom_added": True,
                                  "format": ext,
                                  "chapters_count": len(chaps)
                              })
                              with open(f"data/user_books/{bnum}.json", "w", encoding="utf-8") as bf:
                                  json.dump({
                                      "num": bnum,
                                      "title": final_title,
                                      "lang": up_cfg["lang"],
                                      "category": up_cfg["category"],
                                      "chapters": chaps
                                  }, bf, ensure_ascii=False)
                              admins_state["pending_upload"] = None
                              send_tg(chat_id, f"✅ تم تثبيت الكتاب «{final_title}» في التطبيق بنجاح!\n• اللغة: {up_cfg['lang'].upper()}\n• القسم: {up_cfg['category']}\n• رقمه الإداري: [{bnum}]")

          with open(admins_path, "w", encoding="utf-8") as f:
              json.dump(admins_state, f, ensure_ascii=False, indent=2)
          with open(quiz_path, "w", encoding="utf-8") as f:
              json.dump(quizzes, f, ensure_ascii=False, indent=2)
          with open(catalog_path, "w", encoding="utf-8") as f:
              json.dump(catalog_state, f, ensure_ascii=False, indent=2)
          EOF

      - name: Commit Updated Admin State, Quizzes & Books
        run: |
          git config user.name "RohAlquranBot"
          git config user.email "bot@rohalquran.app"
          git add data/
          git diff --staged --quiet || (git commit -m "Process Bot Admin CMS commands and update quizzes/books" && git pull --rebase origin main && git push)
